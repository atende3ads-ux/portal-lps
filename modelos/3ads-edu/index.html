sões orientadas pelos indicadores de desempenho.",slug:"performance",image:"programa-performance.webp",alt:"Notebook e relatório impresso apresentando métricas e indicadores de performance"},{title:"Tráfego Pago",category:"Mídia",description:"Desenvolva habilidades para criar anúncios, segmentar públicos e gerenciar campanhas nas plataformas de mídia.",slug:"trafego-pago",image:"programa-trafego-pago.webp",alt:"Marca conectada aos principais canais e plataformas de mídia paga"},{title:"Personal Branding e Apresentações de Alto Impacto",category:"Comunicação",description:"Fortaleça seu posicionamento e aprenda a comunicar ideias com clareza, presença e confiança.",slug:"personal-branding",image:"programa-personal-branding.webp",alt:"Apresentador explicando uma estratégia visual diante de uma audiência"}],Tn=[{name:"Treinamentos",description:"Para desenvolver habilidades que a equipe precisa aplicar.",image:"formato-treinamentos.webp",alt:"Participantes reunidos após um treinamento de inteligência artificial da 3ADS",position:"center 56%"},{name:"Workshops",description:"Para explorar um tema e colocar o time em prática.",image:"formato-workshops.webp",alt:"Carlos Costa conduzindo um workshop diante de participantes",position:"center 45%"},{name:"Mentorias",description:"Para apoiar líderes em decisões e desafios específicos.",image:"formato-mentorias.webp",alt:"Guilherme Medeiros apresentando uma aplicação de inteligência artificial",position:"center 45%"},{name:"Consultorias",description:"Para analisar processos e orientar os próximos passos.",image:"formato-consultorias.webp",alt:"Equipe e participantes reunidos em uma experiência conduzida pela 3ADS",position:"center"}],Pv=[{title:"Entender",text:"Conhecemos os objetivos, o contexto e o nível da equipe."},{title:"Desenhar",text:"Selecionamos conteúdos conectados às prioridades do negócio."},{title:"Praticar",text:"Trabalhamos o aprendizado com participação ativa do time."},{title:"Acompanhar",text:"Avaliamos feedbacks e resultados para orientar a evolução."}],ep=[{name:"Nathália Machado",specialty:"Marketing & experiência",image:"nathalia-machado.webp",bio:"Marketing, inteligência digital e UX aplicados à melhoria de processos e experiências."},{name:"Guilherme Medeiros",specialty:"Growth & mídia",image:"guilherme-medeiros.webp",bio:"Growth e mídia paga, com atuação em planejamento, execução e otimização de campanhas."},{name:"Carlos Costa",specialty:"Tecnologia & negócios",image:"carlos-costa.webp",bio:"Tecnologia, marketing e vendas, com experiência em consultoria e formação de profissionais."}],ap=[{question:"O conteúdo é adaptado à minha empresa?",answer:"Sim. Consideramos os objetivos do negócio, o contexto da empresa e o nível de conhecimento da equipe para conectar o conteúdo aos desafios reais dos participantes."},{question:"Os encontros são presenciais ou online?",answer:"Os programas podem ser realizados presencialmente ou online. O formato mais adequado é definido de acordo com os objetivos, o perfil dos participantes e a dinâmica desejada para a experiência."},{question:"Minha equipe precisa ter conhecimento prévio?",answer:"Não necessariamente. Antes do programa, entendemos o nível de conhecimento dos participantes para ajustar a linguagem, a profundidade e as atividades. Quando houver algum pré-requisito, ele será informado previamente."},{question:"Quais formatos de programa estão disponíveis?",answer:"A 3ADS EDU desenvolve workshops, imersões, treinamentos, consultorias e mentorias. A recomendação do formato acontece depois de entendermos o desafio e o resultado que sua empresa deseja alcançar."},{question:"Como sei qual programa é ideal para a minha equipe?",answer:"Começamos com uma conversa de diagnóstico. A partir dela, avaliamos o desafio, o público, o momento da empresa e os objetivos esperados para recomendar a solução mais adequada."},{question:"Os programas são apenas teóricos?",answer:"Não. Os conteúdos são conectados à prática e podem incluir exercícios, discussões, ferramentas, produção de materiais e aplicação em desafios reais da empresa."},{question:"É possível criar uma trilha com vários encontros?",answer:"Sim. Dependendo do objetivo, o programa pode ser estruturado como uma jornada com módulos, atividades entre os encontros e momentos de acompanhamento."},{question:"Qual é a duração de um programa?",answer:"A duração varia conforme o formato, o tema, a quantidade de participantes e a profundidade necessária. Depois do diagnóstico, apresentamos uma proposta com carga horária e cronograma recomendados."},{question:"Quantas pessoas podem participar?",answer:"O número ideal depende do formato escolhido. Algumas experiências funcionam melhor com grupos menores e mais interação; outras podem atender públicos maiores. Essa definição faz parte do desenho do programa."},{question:"Quem conduz os encontros?",answer:"Os programas são conduzidos por trainers selecionados de acordo com o tema, os objetivos do projeto e o perfil dos participantes. Antes da realização, todo o conteúdo e a dinâmica são alinhados com a equipe da 3ADS EDU."},{question:"Como os resultados são acompanhados?",answer:"Definimos critérios de sucesso de acordo com cada projeto. Podemos acompanhar indicadores como participação, aprendizagem, aplicação prática, satisfação e evolução dos compromissos assumidos."},{question:"O suporte termina depois do último encontro?",answer:"O encerramento inclui a coleta de feedbacks, o registro de aprendizados e a avaliação dos próximos passos. Quando fizer sentido, também podemos recomendar uma nova etapa, mentoria ou ação de continuidade."},{question:"É possível contratar um programa que ainda não está no portfólio?",answer:"Sim. Também desenvolvemos soluções personalizadas. Primeiro avaliamos a necessidade e a viabilidade do projeto; depois definimos formato, escopo, cronograma e entregáveis."},{question:"Como funciona o investimento?",answer:"O investimento é definido conforme o formato, a carga horária, o nível de personalização, o número de participantes e a logística envolvida. Após a conversa inicial, você recebe uma proposta clara com o escopo completo."},{question:"Como faço para solicitar uma proposta?",answer:"Fale com a nossa equipe e conte brevemente qual é o desafio da sua empresa, quem participará e qual resultado vocês buscam. A partir disso, marcamos uma conversa para entender o cenário e indicar o melhor caminho."}],lp=["Unimed Cerrado","Alata","IPOG Vitória","Grupo Saga","CBCO Hospital de Olhos","Terral","Alexfarma","MyBroker"],Ts="1.0",Wd="3adsedu_privacy_preferences",As="3adsedu:privacy-changed",xs="GTM-K82W4KD";function $i(...h){window.dataLayer=window.dataLayer||[],window.dataLayer.push(arguments)}function Fd(h){return{analytics_storage:h?.analytics?"granted":"denied",ad_storage:h?.marketing?"granted":"denied",ad_user_data:h?.marketing?"granted":"denied",ad_personalization:h?.marketing?"granted":"denied"}}function Wi(){try{const h=window.localStorage.getItem(Wd);if(!h)return null;const E=JSON.parse(h);return E.version!==Ts||E.mode!=="basic"||E.necessary!==!0||typeof E.analytics!="boolean"||typeof E.marketing!="boolean"||typeof E.updatedAt!="string"?null:E}catch{return null}}function tp(){if(document.querySelector(`script[data-gtm-id="${xs}"]`))return;window.dataLayer.push({"gtm.start":Date.now(),event:"gtm.js"});const h=document.createElement("script");h.async=!0,h.src=`https://www.googletagmanager.com/gtm.js?id=${xs}`,h.dataset.gtmId=xs,document.head.append(h)}function np(){const h=["_ga","_gid","_gat","_fbp","_fbc","_clck","_clsk"],E=new Set(["CLID","ANONCHK","MR","MUID","SM"]),N=window.location.hostname.split("."),d=["",window.location.hostname,N.length>2?`.${N.slice(-2).join(".")}`:`.${window.location.hostname}`];for(const T of document.cookie.split(";")){const U=T.split("=")[0]?.trim();if(!(!U||!h.some(M=>U.startsWith(M))&&!E.has(U)))for(const M of d)document.cookie=`${U}=; Max-Age=0; path=/; SameSite=Lax${M?`; domain=${M}`:""}`}}function Id( omatizar processos e otimizar campanhas.","Identificar oportunidades de mercado e prever tendências.","Criar funis de conversão mais eficientes.","Segmentar clientes e personalizar experiências com IA.","Medir e escalar resultados com metodologias ágeis.","Automatizar atendimento e interações com chatbots e assistentes virtuais.","Analisar dados de forma inteligente para decisões mais estratégicas."],overview:"O marketing evoluiu, e quem deseja crescer precisa usar dados, automação e inteligência artificial para escalar resultados. No curso “Growth Marketing e IA”, você aprenderá estratégias de crescimento, como utilizar IA para otimizar processos e identificar oportunidades com menos esforço e mais impacto. Com uma abordagem prática, o curso ensina como testar, medir e acelerar resultados, integrando IA em campanhas e decisões estratégicas.",audience:"Se você busca acelerar o crescimento do seu negócio de forma inteligente, utilizando estratégias de Growth Marketing e Inteligência Artificial, este curso é para você! Seja você um profissional de marketing, empreendedor ou analista de dados, aqui você aprenderá a otimizar campanhas, prever tendências e escalar seus resultados de maneira eficiente.",gallery:Kl},"tecnicas-de-vendas-e-crm":{slug:"tecnicas-de-vendas-e-crm",type:"Treinamento",title:"Técnicas de Vendas e CRM",headline:"Domine vendas consultivas com CRM e acelere seus resultados com inteligência!",duration:"3 módulos",learning:["Entender o perfil do cliente e criar abordagens personalizadas.","Estratégias de prospecção, negociação e fechamento de vendas.","Superação de objeções e fidelização de clientes.","Uso estratégico de um CRM para gerenciar contatos e acompanha oportunidades.","Automação de tarefas e análise de métricas para melhorar a performance."],overview:"Neste curso, dividido em três módulos principais, você aprenderá a entender as necessidades do cliente, construir relacionamentos e utilizar ferramentas estratégicas para otimizar os resultados. No mundo dos negócios, vender vai além de oferecer um produto ou serviço, portanto, combinaremos técnicas avançadas de vendas com a utilização eficaz de um CRM (Customer Relationship Management), permitindo que profissionais da área comercial aumentem suas taxas de conversão, fidelizem clientes e tornem seus processos mais organizados e produtivos.",audience:"O curso é ideal para vendedores, representantes comerciais e consultores de vendas, empreendedores e gestores que desejam otimizar seus processos comerciais, profissionais de atendimento e relacionamento com clientes e qualquer pessoa interessada em aprimorar suas habilidades de venda e organização comercial.",gallery:Kl},"atendimento-cx":{slug:"atendimento-cx",type:"Treinamento",title:"Atendimento e Customer Experience (CX)",headline:"Saiba como transformar as interações em experiências memoráveis.",duration:"18 horas de imersão",learning:["Transformar interações em experiências memoráveis e fidelizar clientes.","Os fundamentos do Customer Experience (CX) e seu impacto nos negócios.","Técnicas de comunicação eficaz para um atendimento empático e assertivo.","Mapear a jornada do cliente e identificar melhorias no atendimento.","Lidar com reclamações e resolver problemas de forma estratégica.","Personalizar o atendimento para criar conexões genuínas.","Implementar um atendimento omnichannel e oferecer uma experiência integrada.","Métricas essenciais para medir e melhorar a experiência do cliente."],overview:"Em um mercado cada vez mais competitivo, oferecer um atendimento excepcional não é mais um diferencial, e sim uma necessidade. O curso “Atendimento e Customer Experience (CX)” é um treinamento imersivo de 18 horas que ensinará como transformar cada interação com o cliente em uma experiência memorável, promovendo fidelização e satisfação.",audience:"O curso é ideal para atendentes e representantes de suporte que querem melhorar suas interações com os clientes, empreendedores e empresários que desejam aumentar a satisfação e fidelizar seu público, líderes e gerentes de atendimento que buscam implementar estratégias eficazes de Customer Experience, profissionais de vendas e pós-vendas que querem fortalecer a conexão com seus clientes e equipes de marketing e customer success que desejam alinhar a experiência do cliente com a proposta da marca.",gallery:Kl},performance:{slug:"performance",type:"Treinamento",title:"Performance: do básico ao avançado",headline:"Planeje, otimize e escale campanhas que geram resultados com mais performance e menor custo!",duration:"18 horas de imersão",learning:["Como planejar, estruturar e otimizar campanhas de anúncios pagos.","Estratégias para melhorar a performance e reduzir o custo por conversão.","Como testar, analisar e escalar campanhas de forma eficiente.","Técnicas para segmentação e copywriting em anúncios.","Ferramentas essenciais para otimização e automação de campanhas."],overview:"Este curso, dividido em três módulos de 6 horas cada, é essencial para quem deseja dominar a performance de anúncios e campanhas pagas. Estruturado de modo a trabalhar questões de conhecimento que vão desde o básico ao avançado, você aprenderá a criar campanhas estratégicas que geram resultados reais, entenderá como realizar a otimização das suas campanhas e reduzir custos, além de dominar técnicas avançadas de segmentação, remarketing e análise de métricas. Com um método prático e baseado em dados, o curso ajudará você a transformar seus anúncios em máquinas de resultados.",audience:"O curso é ideal para profissionais de marketing digital que desejam melhorar seus resultados, gestores de tráfego que buscam otimizar campanhas e aumentar o ROI, donos de negócios que querem atrair mais clientes por meio de anúncios pagos, freelancers e afiliados que trabalham com mídia paga e qualquer pessoa interessada em dominar a performance de campanhas.",gallery:Kl},"trafego-pago":{slug:"trafego-pago",type:"Treinamento",title:"Tráfego Pago",headline:"Aprenda a criar anúncios lucrativos. Domine o tráfego pago para transformar cliques em clientes.",duration:"18 horas de imersão",learning:["Fundamentos do Tráfego Pago.","Estratégias avançadas de segmentação.","Criação de anúncios de alto desempenho.","Otimização e escala de campanhas.","Automação e Inteligência Artificial no Tráfego Pago."],overview:"No mundo digital, a visibilidade e o alcance são fundamentais para o sucesso de qualquer negócio. No entanto, para atrair clientes e gerar vendas, é essencial dominar o tráfego pago, uma das estratégias mais poderosas do marketing digital. Neste curso você aprenderá a transformar investimentos em anúncios em resultados concretos, seja para o seu próprio negócio ou para clientes que buscam crescimento no ambiente online. Com uma carga horária de 18 horas, distribuídas em três módulos completos, o curso aborda desde os conceitos fundamentais até as estratégias mais avançadas.",audience:"O curso é ideal para empreendedores que desejam aumentar as vendas e atrair mais clientes por meio de anúncios online, profissionais de marketing digital que buscam se especializar em tráfego pago e potencializar resultados, gestores de tráfego que querem aprimorar suas estratégias e dominar novas técnicas, freelancers e agências que desejam oferecer serviços de tráfego pago e escalar seus negócios e iniciantes no marketing digital que querem aprender do zero e construir uma carreira na área.",gallery:Kl},"personal-branding":{slug:"personal-branding",type:"Treinamento",title:"Personal Branding e Apresentações de Alto Impacto",headline:"Construa autoridade, comunique com impacto e torne-se referência no seu mercado!",duration:"18 horas de imersão",learning:["A importância do Personal Branding no mercado atual.","Como se tornar uma autoridade no seu nicho.","Técnicas de comunicação e oratória para apresentações de alto impacto.","Uso do storytelling para criar conexões reais.","Como superar o medo de falar em público e transmitir confiança."],overview:"E
