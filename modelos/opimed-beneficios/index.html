<meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="connect-src 'self' data: blob: https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://unpkg.com https://fonts.googleapis.com https://fonts.gstatic.com https://*.lottiefiles.com https://lottie.host https://maps.googleapis.com https://maps.gstatic.com; form-action 'none'"><meta name="robots" content="noindex,nofollow"><script>/* Injetado no topo de cada LP copiada para o portal.
   Bloqueia rastreamento (GTM, Pixel, GA, Clarity...), envio de formulários
   e links de contato, para o modelo não sujar dados nem gerar lead para o cliente. */
(function () {
  var BLOQ = /googletagmanager\.com|google-analytics\.com|googleadservices\.com|doubleclick\.net|connect\.facebook\.net|facebook\.com\/tr|clarity\.ms|hotjar\.com|analytics\.tiktok\.com|snap\.licdn\.com|ads-twitter\.com|bat\.bing\.com|d335luupugsy2\.cloudfront\.net\/js\/loader-scripts|leadster|hs-scripts\.com|hs-analytics\.net|pinimg\.com\/ct|kwai|taboola|outbrain/i;
  var CONTATO = /^(https?:)?\/\/(wa\.me|api\.whatsapp\.com|web\.whatsapp\.com|chat\.whatsapp\.com|m\.me|t\.me)\b|^(whatsapp|tel|mailto|sms):/i;
  var noop = function () {};

  var ultimo = 0;
  function avisa(msg) {
    var agora = Date.now();
    if (agora - ultimo < 1200) return;
    ultimo = agora;
    try {
      var host = document.createElement('div');
      host.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:2147483647;pointer-events:none';
      var raiz = host.attachShadow ? host.attachShadow({ mode: 'closed' }) : host;
      raiz.innerHTML = '<div style="font:500 14px/1.4 system-ui,-apple-system,sans-serif;color:#fff;background:#111;border:1px solid #333;padding:12px 18px;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.35);white-space:nowrap">' + msg + '</div>';
      (document.body || document.documentElement).appendChild(host);
      setTimeout(function () { host.remove(); }, 2600);
    } catch (e) {}
    try { parent !== window && parent.postMessage({ portalLps: 'bloqueio', msg: msg }, '*'); } catch (e) {}
  }

  // Stubs: o código da página pode chamar fbq()/gtag() sem quebrar.
  function stub() {
    var f = function () { return f; };
    return new Proxy(f, {
      get: function (t, p) {
        if (typeof p === 'symbol') return undefined;
        return p === 'push' || p === 'callMethod' ? noop : (p === 'queue' ? [] : f);
      },
      apply: function () { return f; }
    });
  }
  window.dataLayer = window.dataLayer || [];
  ['fbq', '_fbq', 'ttq', 'clarity', 'hj', 'lintrk', 'uetq', 'twq', 'pintrk', 'kwaiq', 'RdIntegration'].forEach(function (n) {
    try { window[n] = stub(); } catch (e) {}
  });
  window.gtag = noop;

  // Scripts, iframes e imagens de rastreio não carregam.
  function trava(proto, tag) {
    var d = Object.getOwnPropertyDescriptor(proto, 'src');
    if (!d || !d.set) return;
    Object.defineProperty(proto, 'src', {
      configurable: true, enumerable: true,
      get: function () { return d.get.call(this); },
      set: function (v) {
        if (BLOQ.test(String(v))) { if (tag === 'SCRIPT') this.type = 'text/bloqueado'; return; }
        d.set.call(this, v);
      }
    });
  }
  trava(HTMLScriptElement.prototype, 'SCRIPT');
  trava(HTMLIFrameElement.prototype, 'IFRAME');
  trava(HTMLImageElement.prototype, 'IMG');
  var setAttr = Element.prototype.setAttribute;
  Element.prototype.setAttribute = function (n, v) {
    if (/^(src|href)$/i.test(n) && /^(SCRIPT|IFRAME|IMG|LINK)$/.test(this.tagName) && BLOQ.test(String(v))) return;
    return setAttr.apply(this, arguments);
  };

  // Rede: nada sai para rastreio, e nenhum POST/PUT sai da página.
  function envio(url, metodo) {
    return BLOQ.test(String(url)) || !/^(GET|HEAD)$/i.test(metodo || 'GET');
  }
  if (window.fetch) {
    var f0 = window.fetch;
    window.fetch = function (i, o) {
      var url = (i && i.url) || String(i);
      var m = (o && o.method) || (i && i.method) || 'GET';
      if (envio(url, m)) {
        if (!BLOQ.test(url)) avisa('Modelo de demonstração · envio desativado');
        return Promise.reject(new TypeError('Bloqueado no portal de modelos'));
      }
      return f0.apply(this, arguments);
    };
  }
  var xo = XMLHttpRequest.prototype.open, xs = XMLHttpRequest.prototype.send;
  XMLHttpRequest.prototype.open = function (m, u) {
    this.__portalBloq = envio(u, m);
    this.__portalRastreio = BLOQ.test(String(u));
    return xo.apply(this, arguments);
  };
  XMLHttpRequest.prototype.send = function () {
    if (this.__portalBloq) {
      if (!this.__portalRastreio) avisa('Modelo de demonstração · envio desativado');
      var x = this;
      setTimeout(function () { x.dispatchEvent(new Event('error')); x.dispatchEvent(new Event('loadend')); }, 0);
      return;
    }
    return xs.apply(this, arguments);
  };
  if (navigator.sendBeacon) navigator.sendBeacon = function () { return true; };
  // Service worker de uma LP poderia ficar preso ao endereço do portal.
  try {
    if (navigator.serviceWorker) navigator.serviceWorker.register = function () { return Promise.reject(new Error('Desativado no portal')); };
  } catch (e) {}

  // Formulários: o envio não acontece, mas a interação até o botão funciona.
  window.addEventListener('submit', function (e) {
    e.preventDefault();
    e.stopImmediatePropagation();
    avisa('Modelo de demonstração · formulário desativado');
  }, true);
  HTMLFormElement.prototype.submit = function () { avisa('Modelo de demonstração · formulário desativado'); };

  // Links de contato (WhatsApp, telefone, e-mail) não abrem; externos vão para nova aba.
  document.addEventListener('click', function (e) {
    var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
    if (!a) return;
    var h = a.getAttribute('href') || '';
    if (CONTATO.test(h)) {
      e.preventDefault();
      e.stopImmediatePropagation();
      avisa('Modelo de demonstração · link de contato desativado');
    } else if (/^https?:/i.test(h) && a.host !== location.host) {
      a.target = '_blank';
      a.rel = 'noopener';
    }
  }, true);
  var abre = window.open;
  window.open = function (u) {
    if (CONTATO.test(String(u || '')) || BLOQ.test(String(u || ''))) {
      avisa('Modelo de demonstração · link de contato desativado');
      return null;
    }
    return abre.apply(window, arguments);
  };
})();

ntent:flex-end}.brand{font-size:20px}.card{padding:20px}nav{gap:2px}nav button{padding:8px}.steps{gap:5px}.step{font-size:12px;padding:6px}.price{font-size:28px}}

<body>
<div class="lab"><div><strong>Protótipo de diagnóstico</strong> · Dados fictícios · Nenhuma contratação ou cobrança real</div><div class="row"><button data-go="mapa">Mapa e premissas</button><button id="reset">Reiniciar</button></div></div>
<header><div class="brand">Opimed <span>Benefícios</span></div><nav aria-label="Navegação principal"><button data-go="inicio">O clube</button><button data-go="planos">Planos</button><button data-go="acesso">Área do cliente</button><button data-go="ajuda">Ajuda</button></nav></header>

<footer class="footer">Reconstrução exploratória para a 3ADS · Base: materiais de produto e documentação beta 0.5 de julho/2026. Não é uma reprodução fiel do aplicativo nem uma definição aprovada da nova web.</footer>
<script>
const app=document.querySelector('#app');
const plans={Bronze:{price:49.9,discount:10,reserve:false},Prata:{price:59.9,discount:15,reserve:false},Ouro:{price:69.9,discount:20,reserve:true}};
const money=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
let state={plan:'Prata',status:'active',logged:false,eligibility:'yes',consent:false,paid:false};
let page='inicio';
const button=(label,target,type='')=>`<button class="btn ${type}" data-go="${target}">${label}</button>`;
const title=(eyebrow,name,desc='')=>`<div class="sectiontitle"><div class="eyebrow">${eyebrow}</div><h1 class="screen-title" tabindex="-1">${name}</h1>${desc?`<p class="lead">${desc}</p>`:''}</div>`;
const note=(body)=>`<details><summary>Notas do diagnóstico · origem e pontos em aberto</summary>${body}</details>`;
const steps=n=>`<div class="steps" aria-label="Etapas da contratação">${['Plano','Elegibilidade','Dados','Condições','Pagamento'].map((t,i)=>`<span class="step ${n===i?'current':''}" ${n===i?'aria-current="step"':''}>${i+1}. ${t}</span>`).join('')}</div>`;
const summary=()=>`<aside class="card summary"><span class="tag">Sua escolha</span><h2 style="margin-top:14px">Plano ${state.plan}</h2><div class="line"><span>Mensalidade</span><strong>${money(plans[state.plan].price)}</strong></div><div class="line"><span>Adesão</span><strong>${money(plans[state.plan].price)}</strong></div><p class="muted" style="margin-top:15px">Adesão e mensalidade são valores separados. O documento informa ambos os valores, mas não especifica a data da adesão nem se ela é cobrada junto da primeira mensalidade.</p>${button('Trocar plano','planos','quiet')}</aside>`;
const memberNav=()=>`<nav class="dashnav" aria-label="Área do cliente">${[['painel','Visão geral'],['beneficios','Benefícios'],['cashback','Cashback'],['pagamentos','Pagamentos'],['perfil','Meu perfil']].map(([p,l])=>`<button class="${page===p?'active':''}" data-go="${p}">${l}</button>`).join('')}</nav>`;
const statusLabel=()=>({active:'Ativa',pending:'Aguardando pagamento',late:'Pagamento em atraso',none:'Sem assinatura'})[state.status];
const scenario=()=>`<div class="scenario row between"><span><strong>Explorar cenário</strong> <small>· controle apenas do protótipo</small></span><label class="screenreader" for="scenario">Situação da assinatura</label><select id="scenario">${[['active','Assinatura ativa'],['pending','Pagamento pendente'],['late','Pagamento em atraso'],['none','Sem assinatura']].map(([v,l])=>`<option value="${v}" ${state.status===v?'selected':''}>${l}</option>`).join('')}</select></div>`;
function render(){
document.querySelectorAll('header nav button').forEach(b=>b.classList.toggle('active',b.dataset.go===page||b.dataset.go==='acesso'&&['painel','beneficios','cashback','pagamentos','perfil'].includes(page)));
const p=plans[state.plan];
const views={
inicio:()=>`${title('Entenda o produto','Um clube para acompanhar o cuidado com seu aparelho auditivo.','Uma assinatura mensal para clientes Opimed, com benefícios de proteção, descontos e acúmulo de cashback, conforme as condições do plano.')}<div class="hero"><span class="tag">Sem instalar aplicativo</span><h2 style="margin-top:16px">Você compra o aparelho. O clube oferece benefícios para o período de uso.</h2><p>São coisas diferentes: o aparelho é seu equipamento; o clube é uma assinatura opcional. Você escolhe Bronze, Prata ou Ouro e acompanha seu plano nesta área.</p><div class="row">${button('Conhecer os planos','planos')}${button('Explorar uma conta de exemplo','painel','secondary')}</div></div><div class="grid section"><div class="card"><span class="num">1</span><h3>Entenda os benefícios</h3><p>Conheça as condições de proteção do aparelho, descontos em acessórios e cashback.</p></div><div class="card"><span class="num">2</span><h3>Escolha e contrate</h3><p>A contratação é destinada a clientes com aparelho na garantia. Há mensalidade e taxa de adesão.</p></div><div class="card"><span class="num">3</span><h3>Acompanhe seu plano</h3><p>Veja a situação da assinatura, benefícios, pagamentos e informações de cashback.</p></div></div><div class="notice"><strong>Para quem é?</strong><p>Clientes Opimed com aparelho dentro da garantia. Familiares e cuidadores podem participar do processo; as regras para acesso por outra pessoa ainda precisam ser definidas.</p></div>${note('<p><strong>Conteúdo:</strong> síntese do documento de produto. Os textos desta demonstração foram redigidos para explicar o clube e não são a copy extraída das telas antigas.</p><p><strong>Proposta:</strong> esta apresentação pública e a organização web são hipóteses de experiência. A versão anterior tinha um onboarding em três passos.</p>')}`,
planos:()=>`${steps(0)}${title('Contratação','Qual plano faz sentido para você?','Os três planos oferecem proteção e cashback. Compare os diferenciais antes de escolher.')}<div class="grid">${Object.entries(plans).map(([name,x])=>`<article class="card ${state.plan===name?'selection':''}"><span class="tag">${name}</span><div class="price" style="margin-top:18px">${money(x.price)}<small> / mês</small></div><p class="muted">+ ${money(x.price)} de adesão</p><ul><li>Proteção conforme condições do clube</li><li>Franquia de 50% do valor da nota fiscal ao acionar a proteção</li><li>Até ${x.discount}% de desconto em acessórios</li><li>Cashback acumulado de até 100%</li><li>${x.reserve?'Inclui aparelho reserva, conforme condições':'Não inclui aparelho reserva'}</li></ul><button class="btn full" data-plan="${name}">Escolher ${name}</button></article>`).join('')}</div><div class="notice"><strong>O que é franquia?</strong><p>É a parte do custo que fica com o cliente ao utilizar a proteção. O material informa 50% da nota fiscal; a cobertura e as condições detalhadas ainda precisam ser aprovadas.</p></div>${note('<p><strong>Informado na seção 2:</strong> preços, adesão, franquia, descontos por plano, aparelho reserva exclusivo do Ouro, cashback de até 100% e prazo de resgate. Esses dados já estão disponíveis e orientam esta demonstração.</p><p><strong>Explicitamente pendente:</strong> pequenos reparos (seção 2); carência, permanência, cancelamento, cobertura detalhada e regras de resgate (seção 7). A base exata de cálculo do percentual não é explicada no documento de produto.</p>')}`,
elegibilidade:()=>`${steps(1)}${title('Antes de contratar','Seu aparelho está na garantia?','O clube é destinado a clientes Opimed com aparelho dentro do período de garantia.')}<div class="two"><section class="card"><div class="notice warn"><strong>Verificação simulada</strong><p>O método real de validação ainda será definido pela Opimed. Aqui você pode explorar os três resultados possíveis.</p></div><div class="field"><label for="eligible">Situação do aparelho de exemplo</label><select id="eligible"><option value="yes" ${state.eligibility==='yes'?'selected':''}>Dentro da garantia</option><option value="no" ${state.eligibility==='no'?'selected':''}>Fora da garantia</option><option value="unknown" ${state.eligibility==='unknown'?'selected':''}>Não sei / cadastro não localizado</option></select></div><button class="btn" id="check-eligibility">Verificar e continuar</button><div id="eligibility-result" aria-live="polite"></div></section>${summary()}</div>${note('<p><strong>Confirmado no material:</strong> contratação durante a garantia.</p><p><strong>Hipótese:</strong> esta etapa separada e o encaminhamento ao atendimento. Não existe consulta a uma base real neste protótipo.</p>')}`,
dados:()=>`${steps(2)}${title('Cadastro de exemplo','Quem vai usar os benefícios?','Para esta demonstração, usamos uma cliente fictícia. Não informe dados pessoais reais.')}<div class="two"><form class="card" id="profile-form"><div class="formgrid"><div class="field"><label for="fullname">Nome</label><input id="fullname" value="Maria de Exemplo" readonly></div><div class="field"><label for="email">E-mail</label><input id="email" value="maria@example.com" readonly></div></div><p class="muted">O cadastro anterior também solicita CPF, telefone, nascimento e senha. Aqui esses dados são omitidos; os campos necessários à nova web precisam ser revisados.</p><div class="field"><label for="actor">Quem está preenchendo?</label><select id="actor"><option value="self">A própria cliente</option><option value="helper">Um familiar ou cuidador ajudando a cliente</option></select></div><div id="helper-note"></div><button class="btn" type="submit">Continuar para as condições</button></form>${summary()}</div>${note('<p><strong>Documentado:</strong> cadastro e login existentes no app.</p><p><strong>Proposta:</strong> reduzir o preenchimento e esclarecer quem está operando. A participação de familiar não cria autorização automática nem acesso independente.</p>')}`,
condicoes:()=>`${steps(3)}${title('Condições','Revise antes de continuar.','Este resumo ajuda a entender o que será contratado. Ele não substitui os termos do produto.')}<div class="two"><form class="card" id="terms-form"><h2>Plano ${state.plan}</h2><ul><li>Mensalidade de ${money(p.price)} e adesão de ${money(p.price)}, apresentadas separadamente.</li><li>Contratação permitida durante a garantia do aparelho.</li><li>Franquia de 50% da nota fiscal para acionamento da proteção, conforme condições.</li><li>Prazo informado para resgate do cashback: até seis meses após o fim da garantia. Esse limite já está informado; as demais condições de resgate estão em validação na seção 7.</li></ul><div class="notice warn"><strong>Condições ainda em definição</strong><p>Carência, permanência, cancelamento, cobertura detalhada e regras de resgate do cashback (seção 7 do documento). Em uma contratação real, essas definições e os termos aprovados seriam necessários.</p></div><div class="check"><input type="checkbox" id="consent" required ${state.consent?'checked':''}><label for="consent">Entendi que estou navegando em uma simulação, sem aceite contratual nem cobrança.</label></div><button class="btn" type="submit">Ir para pagamento simulado</button></form>${summary()}</div>${note('<p><strong>Fonte:</strong> material de produto e decisões em aberto. Não foi fornecido um texto contratual final; por isso, não inventamos termos legais.</p>')}`,
checkout:()=>`${steps(4)}${title('Pagamento de demonstração','Como a contratação é concluída?','No aplicativo documentado, o pagamento por cartão abre uma página externa do Asaas. Aqui simulamos o resultado desse processo.')}<div class="two"><section class="card"><span class="tag">Cartão · mensal automático</span><h2 style="margin-top:18px">Pagamento em página externa</h2><p>O sistema cria a cobrança. A cliente paga na página do provedor e o sistema recebe a confirmação para atualizar a assinatura.</p><div class="notice"><p>Nenhum dado de cartão é solicitado e nenhum serviço de pagamento será acessado.</p></div><div class="row"><button class="btn" data-payment="success">Simular pagamento aprovado</button><button class="btn secondary" data-payment="pending">Simular confirmação pendente</button><button class="btn quiet" data-payment="error">Simular falha</button></div><hr style="border:0;border-top:1px solid var(--line);margin:25px 0"><h3>Pix <span class="tag warn">Incompleto no app anterior</span></h3><p class="muted">A opção aparece na documentação, mas sua conexão com a jornada ainda estava pendente. Não está disponível nesta simulação.</p></section>${summary()}</div>${note('<p><strong>Documentado:</strong> cartão via página do Asaas; Pix parcialmente implementado.</p><p><strong>Proposta:</strong> os retornos claros de sucesso, pendência e erro a seguir. As telas antigas de retorno não estavam conectadas ao fluxo completo.</p>')}`,
sucesso:()=>`${title('Simulação concluída','Seu plano está ativo.','Maria, agora você pode consultar os benefícios e acompanhar sua assinatura.')}<div class="card"><span class="tag good">Pagamento aprovado · fictício</span><h2 style="margin-top:20px">Plano ${state.plan}</h2><p>Uma confirmação real precisaria informar valores cobrados, datas e próximos passos. Neste protótipo, esses dados não representam uma transação.</p>${button('Entrar na área do cliente','painel')}</div>`,
pendente:()=>`${title('Pagamento','Estamos aguardando a confirmação.','Nesta simulação, o pagamento ainda não foi confirmado e a assinatura está pendente.')}<div class="card"><p>A confirmação pode ocorrer depois do retorno à plataforma. O momento de liberação dos benefícios precisa seguir as regras aprovadas do clube.</p><div class="row">${button('Acompanhar na área do cliente','painel')}<button class="btn secondary" id="confirm-payment">Simular confirmação recebida</button></div></div>`,
erro:()=>`${title('Pagamento','Não foi possível concluir o pagamento.','Esta é uma falha simulada. Nenhuma cobrança real foi feita.')}<div class="card"><p>Na experiência final, será necessário explicar se houve cobrança, como tentar novamente e como obter ajuda.</p><div class="row">${button('Tentar novamente','checkout')}${button('Pedir ajuda','ajuda','secondary')}</div></div>`,
acesso:()=>`${title('Área do cliente','Acesse para acompanhar seu clube.','No aplicativo anterior, o acesso é feito por e-mail e senha.')}<div class="two"><form class="card" id="login-form"><div class="field"><label for="login-email">E-mail de demonstração</label><input id="login-email" value="maria@example.com" readonly></div><div class="field"><label for="login-pass">Senha de demonstração</label><input id="login-pass" type="password" value="exemplo" readonly></div><button class="btn full" type="submit">Entrar na conta de exemplo</button><p style="margin-top:18px"><button class="linkbutton" data-go="recuperar">Não consigo acessar minha conta</button></p></form><aside class="card"><h2>Ainda não faz parte?</h2><p>Conheça o clube, compare os benefícios e veja as condições de contratação.</p>${button('Conhecer os planos','planos','secondary')}</aside></div>${note('<p><strong>Documentado:</strong> e-mail e senha no aplicativo anterior. O mecanismo definitivo para web ainda deve ser escolhido considerando a facilidade de uso.</p>')}`,
recuperar:()=>`${title('Acesso','Precisa de ajuda para entrar?','A recuperação de senha estava incompleta na versão documentada.')}<div class="card"><div class="notice warn">Esta é uma proposta de caminho de ajuda, sem envio real de e-mail ou código.</div><p>A nova experiência precisa definir como recuperar o acesso e como atender pessoas sem acesso ao e-mail cadastrado.</p><div class="row">${button('Ver canais de ajuda','ajuda')}${button('Voltar ao acesso','acesso','secondary')}</div></div>`,
painel:()=>`${memberNav()}${title('Área do cliente','Olá, Maria.','Aqui você entende o que tem contratado e encontra os próximos passos.')}${scenario()}${state.status==='none'?`<div class="card empty"><h2>Você ainda não tem uma assinatura.</h2><p>Compare os três planos para escolher o que atende às suas necessidades.</p>${button('Comparar planos','planos')}</div>`:`<div class="grid"><div class="card"><span class="eyebrow">Meu plano</span><div class="big">${state.plan}</div><span class="tag ${state.status==='active'?'good':'warn'}">${statusLabel()}</span><p class="muted" style="margin-top:12px">${money(p.price)} por mês</p>${button('Ver minha assinatura','perfil','quiet')}</div><div class="card"><span class="eyebrow">Cashback de exemplo</span><div class="big">R$ 120,00</div><p class="muted">Saldo ilustrativo, sem cálculo real.</p>${button('Entender meu cashback','cashback','quiet')}</div><div class="card"><span class="eyebrow">Pagamentos</span><h2>${state.status==='active'?'Tudo em dia':statusLabel()}</h2><p class="muted">${state.status==='active'?'Próximo vencimento: a confirmar.':'Veja a situação e as opções de acompanhamento.'}</p>${button('Ver pagamentos','pagamentos','quiet')}</div></div>${state.status!=='active'?`<div class="notice warn"><strong>Sua assinatura precisa de atenção.</strong><p>Consulte o pagamento ou fale com a equipe para entender a pendência. Regras de suspensão e retomada de benefícios ainda estão em definição.</p></div>`:''}<div class="two section"><div class="card"><h2>O que meu plano oferece?</h2><p>Consulte proteção, descontos e condições dos benefícios.</p>${button('Meus Benefícios','beneficios')}</div><div class="card"><h2>Precisa de ajuda?</h2><p>Encontre orientação para usar o clube ou cuidar da sua assinatura.</p>${button('Falar com a Opimed','ajuda','secondary')}</div></div>`}${note('<p><strong>Documentado:</strong> Home, benefícios e perfil com plano, situação e cashback. O painel unificado e os atalhos são uma proposta de organização para web.</p><p><strong>Diferença importante:</strong> o app anterior encaminhava quem não tinha assinatura ativa para o plano Ouro. Aqui mostramos uma situação clara e oferecemos comparação entre os planos.</p>')}`,
beneficios:()=>`${memberNav()}${title('Meu plano','Benefícios do plano '+state.plan,'Consulte o que cada benefício significa e como buscar orientação.')}${state.status==='none'?`<div class="card"><p>Você está no cenário sem assinatura. Conheça os benefícios antes de contratar.</p>${button('Comparar planos','planos')}</div>`:`${state.status!=='active'?'<div class="notice warn">Assinatura não ativa. A elegibilidade de uso dos benefícios depende das regras do clube; esta página é apenas informativa.</div>':''}<div class="grid"><div class="card"><h2>Proteção do aparelho</h2><p>Benefício de proteção com franquia de 50% da nota fiscal. Eventos cobertos, documentos e condições ainda precisam ser confirmados.</p><button class="btn secondary" data-benefit="protecao">Entender a proteção</button></div><div class="card"><h2>Desconto em acessórios</h2><p>Até ${p.discount}% de desconto. Produtos participantes e forma de utilização precisam ser definidos.</p><button class="btn secondary" data-benefit="desconto">Como utilizar</button></div><div class="card"><h2>Cashback</h2><p>Acumule conforme as regras do clube e acompanhe o saldo. Acumular não significa que o valor já está disponível para resgate.</p>${button('Consultar cashback','cashback','secondary')}</div>${p.reserve?'<div class="card"><h2>Aparelho reserva</h2><p>Benefício previsto para o Ouro. Disponibilidade e condições de retirada e devolução precisam ser esclarecidas.</p><button class="btn secondary" data-benefit="reserva">Ver orientações</button></div>':''}</div>`}${note('<p><strong>Fonte:</strong> benefícios do documento comercial. A estrutura em cartões e os detalhes explicativos são propostos. Pequenos reparos permanecem fora da oferta por falta de aprovação.</p>')}`,
detalhe:()=>`${memberNav()}${title('Benefícios',({protecao:'Entenda a proteção',desconto:'Use seu desconto',reserva:'Aparelho reserva'})[state.benefit]||'Detalhe do benefício')}<div class="two"><div class="card"><h2>Como seguir</h2><p>Entre em contato com a Opimed para receber orientação sobre o benefício e confirmar as condições aplicáveis ao seu caso.</p><div class="notice warn"><strong>O processo precisa ser definido</strong><p>A documentação ainda não fecha os documentos necessários, prazo de atendimento ou regras detalhadas. Não há solicitação real nesta demonstração.</p></div>${button('Ver opções de ajuda','ajuda')}</div><aside class="card"><h3>O que esclarecer no diagnóstico?</h3><ul><li>Em quais situações o benefício pode ser usado?</li><li>Quem analisa e aprova a solicitação?</li><li>O cliente acompanha o pedido por qual canal?</li></ul>${button('Voltar aos benefícios','beneficios','quiet')}</aside></div>`,
cashback:()=>`${memberNav()}${title('Cashback','Saldo acumulado e resgate são coisas diferentes.','O saldo registra o benefício acumulado. A possibilidade de utilizá-lo depende das condições do clube.')}<div class="two"><div class="card"><span class="eyebrow">Exemplo de saldo acumulado</span><div class="big">R$ 120,00</div><p class="muted">Valor fictício escolhido para ilustrar a tela.</p><div class="line"><span>Disponível para resgate</span><strong>A confirmar</strong></div><div class="line"><span>Data de liberação</span><strong>A confirmar</strong></div><div class="line"><span>Fim da garantia</span><strong>Não informado</strong></div><div class="notice warn">Não é possível calcular liberação ou validade sem as regras aprovadas e os dados do aparelho.</div>${button('Tirar dúvidas sobre cashback','ajuda','secondary')}</div><aside class="card"><h2>O que o material informa?</h2><p>Cashback de até 100% e prazo de resgate de até seis meses após o fim da garantia.</p><h3>O que ainda falta?</h3><ul><li>100% de qual valor?</li><li>Como cada pagamento gera saldo?</li><li>Quando começa o período de resgate?</li><li>Onde e como o saldo pode ser utilizado?</li><li>O que acontece em caso de atraso ou cancelamento?</li></ul></aside></div>${note('<p><strong>Atenção à diferença entre materiais:</strong> a documentação antiga descreve mensalidades somadas a pontos. O material mais recente mantém regras detalhadas em validação. Este protótipo não assume uma fórmula nem promete saque em dinheiro.</p>')}`,
pagamentos:()=>`${memberNav()}${title('Assinatura','Seus pagamentos','Histórico ilustrativo para entender a organização da área do cliente.')}${state.status==='none'?`<div class="card empty"><p>Não há assinatura neste cenário.</p>${button('Conhecer planos','planos')}</div>`:`<div class="card"><div class="row between"><h2>Plano ${state.plan}</h2><span class="tag">${statusLabel()}</span></div><div class="tablewrap"><table><thead><tr><th>Descrição</th><th>Valor de exemplo</th><th>Situação</th></tr></thead><tbody><tr><td>Mensalidade atual</td><td>${money(p.price)}</td><td>${state.status==='active'?'Pago':state.status==='pending'?'Aguardando confirmação':'Em atraso'}</td></tr><tr><td>Mensalidade anterior</td><td>${money(p.price)}</td><td>Pago · exemplo</td></tr><tr><td>Adesão</td><td>${money(p.price)}</td><td>Pago · exemplo</td></tr></tbody></table></div><p class="muted" style="margin-top:16px">Sem datas reais. Este histórico não é um comprovante e não deriva de transações do protótipo.</p>${state.status==='pending'?'<button class="btn" id="confirm-payment">Simular confirmação recebida</button>':state.status==='late'?'<button class="btn" id="regularize">Simular regularização</button>':''}<div class="section">${button('Preciso de ajuda com uma cobrança','ajuda','secondary')}</div></div>`}${note('<p><strong>Solicitado no produto:</strong> histórico e próximo vencimento. O histórico completo não foi confirmado nas telas antigas. O consolidado técnico aponta a exibição do próximo vencimento como pendente, embora o dado existisse no sistema.</p>')}`,
perfil:()=>`${memberNav()}${title('Minha conta','Perfil e assinatura','Informações da cliente fictícia usada nesta demonstração.')}<div class="two"><section class="card"><h2>Maria de Exemplo</h2><p>maria@example.com</p><div class="line"><span>Plano</span><strong>${state.status==='none'?'Sem plano':state.plan}</strong></div><div class="line"><span>Situação</span><strong>${statusLabel()}</strong></div><div class="line"><span>Início da assinatura</span><strong>Data de exemplo não definida</strong></div><div class="section row">${button('Pedir ajuda com meus dados','ajuda','secondary')}<button class="btn quiet" id="logout">Sair da conta de exemplo</button></div></section><aside class="card"><h2>Alterações e cancelamento</h2><p>Carência, permanência, cancelamento e eventuais mudanças de plano precisam de definição da Opimed.</p><p>Este protótipo permite procurar orientação, sem inventar condições ou executar uma alteração.</p>${button('Buscar orientação','ajuda','secondary')}</aside></div>`,
ajuda:()=>`${title('Atendimento','Como podemos ajudar?','Escolha um assunto para visualizar a passagem da plataforma para o atendimento.')}<div class="grid">${[['contratar','Quero contratar','Ajuda para entender os planos e verificar a elegibilidade.'],['beneficio','Quero usar um benefício','Orientação sobre proteção, acessórios e aparelho reserva.'],['conta','Minha conta ou pagamento','Ajuda com acesso, cobrança, dados e assinatura.']].map(([id,t,d])=>`<div class="card"><h2>${t}</h2><p>${d}</p><button class="btn secondary" data-help="${id}">Ver atendimento de exemplo</button></div>`).join('')}</div><div id="help-result" aria-live="polite"></div><div class="card section"><h2>Unidades Opimed</h2><p>Encontrar uma unidade é uma necessidade do produto. A tela de localização não estava construída na versão documentada.</p><p class="muted">Não foram fornecidos endereços para esta demonstração. A lista e a forma de localização precisam ser confirmadas.</p></div>${note('<p><strong>WhatsApp:</strong> a Opimed informa uso de Blip integrado ao RD Station. O papel do canal — atendimento humano, automação, consultas ou direcionamento à web — ainda precisa ser decidido. Nenhuma mensagem será enviada.</p>')}`,
admin:()=>`${title('Operação interna · simulação','O que a equipe precisa acompanhar?','A documentação anterior descreve consulta por CPF e edição de assinatura. Esta tela é apenas um esboço dessas necessidades.')}<div class="notice warn">A área administrativa exige acesso restrito. O controle de permissões aparecia como pendência no material antigo. Aqui só há uma cliente fictícia, sem consulta a dados reais.</div><div class="card"><h2>Consulta de cliente de exemplo</h2><button class="btn" id="admin-search">Localizar Maria de Exemplo</button><div id="admin-result"></div></div>${note('<p><strong>Documentado:</strong> consulta e edição de assinatura. Não há elementos suficientes para reconstruir todas as telas administrativas. Uma alteração real exigiria definição de permissões e de suas consequências sobre cobrança e benefícios.</p>')}`,
mapa:()=>`${title('Guia de leitura','Como este produto se organiza','Use este mapa para navegar e separar o que foi documentado do que estamos propondo para entender a experiência.')}<div class="notice"><strong>O produto em uma frase</strong><p>Um clube de assinatura para clientes Opimed com aparelho na garantia: a pessoa contrata um plano, paga mensalmente e acompanha benefícios de proteção, descontos e cashback.</p></div><div class="card"><h2>1. Conhecer e contratar</h2><div class="flow"><span>Entender o clube</span><b>→</b><span>Comparar planos</span><b>→</b><span>Validar elegibilidade</span><b>→</b><span>Dados e condições</span><b>→</b><span>Pagamento</span></div><h2>2. Acompanhar</h2><div class="flow"><span>Acessar</span><b>→</b><span>Visão geral</span><b>→</b><span>Benefícios / Cashback / Pagamentos</span><b>→</b><span>Ajuda</span></div><h2>3. Operar</h2><p>Equipe interna consulta clientes e orienta ou resolve situações que o cliente não consegue concluir sozinho.</p></div><div class="card section"><h2>Regras que já temos no documento do Lucas</h2><div class="tablewrap"><table><thead><tr><th>Condição informada</th><th>Bronze</th><th>Prata</th><th>Ouro</th></tr></thead><tbody><tr><td>Mensalidade</td><td>R$ 49,90</td><td>R$ 59,90</td><td>R$ 69,90</td></tr><tr><td>Adesão, separada da mensalidade</td><td>R$ 49,90</td><td>R$ 59,90</td><td>R$ 69,90</td></tr><tr><td>Franquia ao acionar proteção</td><td>50% da NF</td><td>50% da NF</td><td>50% da NF</td></tr><tr><td>Desconto em acessórios</td><td>Até 10%</td><td>Até 15%</td><td>Até 20%</td></tr><tr><td>Aparelho reserva</td><td>Não</td><td>Não</td><td>Sim</td></tr><tr><td>Cashback acumulado</td><td>Até 100%</td><td>Até 100%</td><td>Até 100%</td></tr><tr><td>Prazo de resgate</td><td colspan="3">Até seis meses após o fim da garantia</td></tr><tr><td>Quando contratar</td><td colspan="3">Durante a garantia do aparelho</td></tr></tbody></table></div><p class="muted" style="margin-top:15px">Fonte: seção 2 da solicitação de proposta. Pequenos reparos estão expressamente em validação e não entram na oferta.</p></div><div class="card section"><h2>Abrir uma parte do protótipo</h2><div class="maplinks">${[['inicio','Apresentação do clube'],['planos','Comparação dos planos'],['elegibilidade','Verificação de elegibilidade'],['dados','Cadastro de exemplo'],['condicoes','Condições da contratação'],['checkout','Pagamento simulado'],['acesso','Acesso do cliente'],['painel','Área do cliente'],['beneficios','Benefícios'],['cashback','Cashback'],['pagamentos','Histórico de pagamentos'],['perfil','Perfil e assinatura'],['ajuda','Atendimento e unidades'],['admin','Esboço administrativo']].map(([id,l])=>button(l,id,'quiet')).join('')}</div></div><div class="card section"><h2>O que é evidência e o que é hipótese?</h2><div class="tablewrap"><table><thead><tr><th>Parte</th><th>Base disponível</th><th>Tratamento neste protótipo</th></tr></thead><tbody><tr><td>Cadastro, login, planos, perfil e benefícios</td><td>Descritos como existentes na beta 0.5</td><td>Reconstrução simplificada; não reproduz os layouts originais</td></tr><tr><td>Pagamento por cartão</td><td>Fluxo externo via Asaas documentado</td><td>Resultados simulados, sem cobrança</td></tr><tr><td>Pix e recuperação de senha</td><td>Conexões ou jornadas incompletas</td><td>Pendência explícita, sem simular implementação existente</td></tr><tr><td>Elegibilidade e acesso de familiares</td><td>Necessidades do novo produto; regras em aberto</td><td>Hipóteses para discussão</td></tr><tr><td>Histórico, ajuda e localização</td><td>Solicitados no material do produto</td><td>Organização proposta; unidades sem endereços fictícios</td></tr><tr><td>Cashback</td><td>Descrição comercial e regra antiga de pontos</td><td>Saldo fictício, sem fórmula ou resgate inventado</td></tr><tr><td>Textos das telas</td><td>Copy original completa não disponível</td><td>Textos explicativos redigidos para esta demonstração</td></tr></tbody></table></div></div><div class="two section"><div class="card"><h2>Decisões que faltam</h2><ul><li>Como comprovar elegibilidade?</li><li>Quem pode acessar e pagar em nome do cliente?</li><li>Como calcular e resgatar cashback?</li><li>Quais são cobertura, carência e cancelamento?</li><li>Quando cobrar adesão e primeira mensalidade?</li><li>O que acontece com benefícios em caso de atraso?</li><li>Qual é o papel do WhatsApp?</li></ul></div><div class="card sources"><h2>Materiais de referência</h2><p><a href="https://drive.google.com/file/d/1poQFDdSlJcFpwOc7rDbtw2YiiRzakh4i/view" target="_blank" rel="noopener">Pacote técnico consolidado · julho/2026</a></p><p><a href="https://drive.google.com/file/d/1ltt_GqNXWkwBcKElVonAT04IFlRfTXGQ/view" target="_blank" rel="noopener">README técnico do aplicativo</a></p><p><a href="https://docs.google.com/document/d/1Oq0KcgGKR_xJrvgPNCQ4oO1GNA_3wzpjlg6_HhkLRo4/edit" target="_blank" rel="noopener">Opimed Benefícios — Solicitação de Proposta</a>: seções 2 a 5 trazem produto e jornadas; seção 7 identifica definições pendentes. Consultado em 16/09/2026.</p><p>Onboarding 3ADS: escopo validado, mapa da plataforma e jornadas principais como entregas da Fase 1.</p><p><strong>Limite:</strong> código, APK e funcionamento real não foram inspecionados. Os estados aqui são demonstrativos.</p></div></div>`
};
app.innerHTML=(views[page]||views.inicio)();
document.title=`${app.querySelector('h1')?.textContent||'Opimed'} · Protótipo`;
bind();
}
function go(target){if(target==='acesso'&&state.logged)target='painel';page=target;if(['painel','beneficios','perfil','cashback','pagamentos'].includes(page))state.logged=true;if(location.hash.slice(1)!==page)history.pushState(null,'','#'+page);render();window.scrollTo(0,0);app.querySelector('h1')?.focus();}
function bind(){
app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
app.querySelectorAll('[data-plan]').forEach(b=>b.onclick=()=>{state.plan=b.dataset.plan;state.consent=false;go('elegibilidade')});
app.querySelectorAll('[data-payment]').forEach(b=>b.onclick=()=>{const result=b.dataset.payment;state.status=result==='success'?'active':'pending';state.logged=result!=='error';state.paid=result==='success';go(result==='success'?'sucesso':result==='pending'?'pendente':'erro')});
app.querySelectorAll('[data-benefit]').forEach(b=>b.onclick=()=>{state.benefit=b.dataset.benefit;go('detalhe')});
const on=(id,event,fn)=>{const e=document.getElementById(id);if(e)e.addEventListener(event,fn)};
on('eligible','change',e=>{state.eligibility=e.target.value;document.getElementById('eligibility-result').innerHTML=''});
on('check-eligibility','click',()=>{if(state.eligibility==='yes')go('dados');else{document.getElementById('eligibility-result').innerHTML=`<div class="notice warn"><strong>${state.eligibility==='no'?'Contratação indisponível neste cenário.':'Precisamos confirmar a elegibilidade.'}</strong><p>${state.eligibility==='no'?'O material limita a contratação ao período de garantia. Procure a Opimed para orientação.':'O cadastro não foi confirmado nesta simulação. A equipe precisa orientar o próximo passo.'}</p><button class="btn secondary" id="eligibility-help">Procurar ajuda</button></div>`;document.getElementById('eligibility-help').onclick=()=>go('ajuda')}});
on('actor','change',e=>document.getElementById('helper-note').innerHTML=e.target.value==='helper'?'<div class="notice warn">A ajuda de um familiar está prevista no contexto do público. Acesso próprio e autorização para agir em nome do cliente ainda precisam de definição.</div>':'');
on('profile-form','submit',e=>{e.preventDefault();go('condicoes')});
on('terms-form','submit',e=>{e.preventDefault();state.consent=true;go('checkout')});
on('login-form','submit',e=>{e.preventDefault();state.logged=true;go('painel')});
on('scenario','change',e=>{state.status=e.target.value;render();document.getElementById('live').textContent='Cenário alterado: '+statusLabel()});
on('confirm-payment','click',()=>{state.status='active';state.paid=true;go('sucesso')});
on('regularize','click',()=>{state.status='active';go('pagamentos')});
on('logout','click',()=>{state.logged=false;go('acesso')});
app.querySelectorAll('[data-help]').forEach(b=>b.onclick=()=>{document.getElementById('help-result').innerHTML=`<div class="notice"><strong>Atendimento de exemplo · ${b.dataset.help==='contratar'?'contratação':b.dataset.help==='beneficio'?'benefícios':'conta e pagamento'}</strong><p>Você seria encaminhado ao canal definido pela Opimed, com o contexto da sua dúvida. O número, os horários e a forma de atendimento ainda precisam ser confirmados.</p><p><strong>Nenhuma conversa foi iniciada e nenhuma mensagem foi enviada.</strong></p></div>`});
on('admin-search','click',()=>{document.getElementById('admin-result').innerHTML=`<div class="section"><h3>Maria de Exemplo</h3><div class="line"><span>Plano</span><strong>${state.plan}</strong></div><div class="line"><span>Situação</span><strong>${statusLabel()}</strong></div><p class="muted" style="margin-top:16px">Registro fictício. A edição de assinatura é descrita no material anterior, mas suas regras não foram fornecidas em detalhe.</p><button class="btn secondary" id="admin-view">Ver a experiência desta cliente</button></div>`;document.getElementById('admin-view').onclick=()=>go('painel')});
}
document.querySelectorAll('header [data-go],.lab [data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
document.getElementById('reset').onclick=()=>{state={plan:'Prata',status:'active',logged:false,eligibility:'yes',consent:false,paid:false};go('inicio')};
window.addEventListener('popstate',()=>{page=location.hash.slice(1)||'inicio';render();window.scrollTo(0,0)});
page=location.hash.slice(1)||'inicio';render();
</script>
</body>
</html>
