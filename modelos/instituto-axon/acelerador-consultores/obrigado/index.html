  function trava(proto, tag) {

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>Recebemos sua aplicação | Instituto Axon</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/logo.svg">
  <meta name="theme-color" content="#071A14">
  <meta name="color-scheme" content="light">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&family=Inter+Tight:wght@600;700;800&family=Barlow+Condensed:wght@500;600&display=swap" rel="stylesheet">
  <style>
    /* ════════════════════════════════════════════
       DESIGN SYSTEM · Instituto Axon · Acelerador
       Tema escuro cinematográfico · acento rosa Axon
       Títulos: Helvetica Neue · Destaques: Instrument Serif itálico
       Texto: Instrument Sans
    ════════════════════════════════════════════ */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --paper:      #071A14;
      --paper-2:    #110B18;
      --surface:    #170F20;
      --surface-2:  #1E1429;
      --ink:        #FBF6F9;
      --ink-2:      #17201D;
      --body-c:     #C2B4BE;
      --faint:      #8E8090;
      --line:       rgba(255,255,255,.08);
      --line-2:     rgba(255,255,255,.16);
      --pink-pale:  rgba(24,201,130,.16);
      --pink-line:  rgba(24,201,130,.32);
      --pink-soft:  rgba(24,201,130,.08);
      --accent:     #18C982;
      --accent-bright:#FF5C92;
      --accent-soft:#FFB3CB;
      --warm:       #FF6738;
      --warm-bg:    rgba(24,201,130,.14);
      --warm-line:  rgba(24,201,130,.34);
      --warm-deep:  #FF9A7A;
      --dark:       #070409;
      --display: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      --serif:   'Instrument Serif', Georgia, 'Times New Roman', serif;
      --sans:    'Instrument Sans', system-ui, sans-serif;
      --r-card: 22px;
      --shadow-card: 0 1px 2px rgba(0,0,0,.35), 0 24px 60px -30px rgba(0,0,0,.85);
      --ease: cubic-bezier(.2,.6,.2,1);
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--sans);
      background: var(--paper);
      color: var(--body-c);
      font-size: 16px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    ::selection { background: var(--accent); color: var(--ink); }
    :focus-visible { outline: 2px solid var(--accent-bright); outline-offset: 3px; border-radius: 4px; }

    h1, h2, h3 { color: var(--ink); }
    h1, h2 { font-family: var(--display); font-weight: 700; }

    .em {
      font-family: var(--serif);
      font-style: italic;
      font-weight: 400;
      font-size: 1.08em;
      letter-spacing: -.01em;
      color: var(--accent-bright);
    }

    img { max-width: 100%; display: block; }
    a { color: inherit; }
    picture { display: block; }

    .wrap   { max-width: 1160px; margin: 0 auto; padding: 0 24px; }
    .narrow { max-width: 880px;  margin: 0 auto; padding: 0 24px; }

    /* ── Ícones ── */
    .ico {
      width: 20px; height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }
    .ico--s { width: 14px; height: 14px; stroke-width: 2; }
    .ico--xs { width: 12px; height: 12px; stroke-width: 2.6; }
    .ico--l { width: 24px; height: 24px; stroke-width: 1.6; }

    .tile {
      position: relative;
      width: 48px; height: 48px;
      border-radius: 15px;
      background: linear-gradient(160deg, rgba(255,255,255,.09), rgba(255,255,255,.02));
      border: 1px solid rgba(255,255,255,.13);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.1), 0 10px 24px -14px rgba(0,0,0,.9);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-bright);
      flex-shrink: 0;
    }
    .tile::after {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: inherit;
      background: radial-gradient(circle at 28% 18%, rgba(69,230,166,.3), transparent 62%);
      pointer-events: none;
    }
    .tile--warm { color: var(--warm); }
    .tile--warm::after { background: radial-gradient(circle at 28% 18%, rgba(24,201,130,.32), transparent 62%); }
    .tile--sm { width: 40px; height: 40px; border-radius: 12px; }

    /* ── Fundo ── */
    .has-grid { position: relative; }
    .has-grid::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px);
      background-size: 56px 56px;
      -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, #000 20%, transparent 80%);
      mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, #000 20%, transparent 80%);
      pointer-events: none;
    }
    .has-glow { overflow: hidden; }
    .has-glow::after {
      content: '';
      position: absolute;
      width: 720px; height: 720px;
      top: -260px; right: -220px;
      background: radial-gradient(circle, rgba(24,201,130,.16), transparent 62%);
      pointer-events: none;
    }
    .has-glow.glow-left::after { right: auto; left: -260px; top: auto; bottom: -260px; }
    section > .wrap, section > .narrow { position: relative; z-index: 1; }

    /* ── Reveal ── */
    .rv { opacity: 0; transform: translateY(18px); transition: opacity .7s var(--ease), transform .7s var(--ease); }
    .rv.in { opacity: 1; transform: none; }
    .d1 { transition-delay: .08s; } .d2 { transition-delay: .16s; }
    .d3 { transition-delay: .24s; } .d4 { transition-delay: .32s; }
    @media (prefers-reduced-motion: reduce) {
      .rv { opacity: 1; transform: none; transition: none; }
    }

    /* ── Chip ── */
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--pink-pale);
      border: 1px solid var(--pink-line);
      color: var(--accent-bright);
      border-radius: 999px;
      padding: 7px 14px 7px 10px;
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: .1em;
      text-transform: uppercase;
      line-height: 1.3;
    }
    .chip .ico { width: 14px; height: 14px; stroke-width: 2; }
    .chip--warm { background: var(--warm-bg); border-color: var(--warm-line); color: var(--warm-deep); }
    .chip--ghost { background: rgba(255,255,255,.05); border-color: var(--line-2); color: var(--ink); }

    /* ── Botões ── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: var(--accent);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 15.5px;
      font-weight: 600;
      letter-spacing: -.01em;
      line-height: 1.3;
      text-align: left;
      padding: 15px 15px 15px 30px;
      border-radius: 999px;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: transform .2s var(--ease), background .2s, box-shadow .2s;
      box-shadow: 0 1px 2px rgba(0,0,0,.35), 0 18px 40px -16px rgba(24,201,130,.7);
    }
    .btn:hover { transform: translateY(-2px); background: #45E6A6; }
    .btn:active { transform: translateY(0); }
    .btn .arr {
      width: 30px; height: 30px;
      border-radius: 50%;
      background: #fff;
      color: var(--accent);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform .2s var(--ease);
    }
    .btn:hover .arr { transform: translateX(3px); }
    .btn--light { background: #fff; color: var(--ink-2); box-shadow: 0 1px 2px rgba(0,0,0,.25), 0 16px 40px -14px rgba(255,255,255,.35); }
    .btn--light:hover { background: #DDF8EC; }
    .btn--light .arr { background: var(--accent); color: var(--ink); }
    .btn--full { width: 100%; text-align: center; }
    .btn--outline {
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--line-2);
      box-shadow: none;
      padding: 12px 12px 12px 24px;
    }
    .btn--outline:hover { background: rgba(255,255,255,.05); border-color: var(--accent-bright); }
    .btn--outline .arr { background: rgba(37,211,102,.16); color: #3EE07F; }
    .link-arrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 15px;
      color: var(--ink);
      text-decoration: none;
      border-bottom: 1px solid rgba(255,255,255,.3);
      padding-bottom: 2px;
      transition: border-color .2s, color .2s;
    }
    .link-arrow:hover { color: var(--accent-bright); border-color: var(--accent-bright); }

    /* ── Cabeçalho ── */
    .site-head {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(7,26,20,.78);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
    }
    .head-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      height: 72px;
    }
    .head-logo img { height: 38px; width: auto; }
    .head-nav { display: flex; align-items: center; gap: 4px; }
    .head-nav a {
      font-size: 14px;
      font-weight: 500;
      color: var(--ink);
      text-decoration: none;
      padding: 9px 14px;
      border-radius: 999px;
      transition: background .2s, color .2s;
    }
    .head-nav a:hover { background: rgba(255,255,255,.07); color: var(--ink); }
    .head-cta { padding: 11px 11px 11px 20px; font-size: 14px; }
    .head-cta .arr { width: 26px; height: 26px; }

    /* ── Hero ── */
    .hero {
      position: relative;
      z-index: 3;
      background: var(--dark);
      color: var(--body-c);
      padding: 96px 0 128px;
      min-height: 760px;
      display: flex;
      align-items: center;
      overflow: visible;
    }
    .hero-clip { position: absolute; inset: 0; overflow: hidden; }
    .hero-bg { position: absolute; inset: 0; z-index: 0; }
    .hero-bg img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 72% 30%;
      display: block;
      filter: saturate(.6);
    }
    .hero-clip::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 1;
      background:
        linear-gradient(90deg, rgba(7,26,20,.97) 0%, rgba(7,26,20,.82) 40%, rgba(7,26,20,.3) 66%, rgba(7,26,20,.1) 100%),
        linear-gradient(180deg, rgba(24,201,130,.14) 0%, rgba(7,26,20,0) 40%, rgba(7,26,20,.8) 100%);
      pointer-events: none;
    }
    .hero-clip::after {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 1;
      background-image:
        linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
      background-size: 56px 56px;
      -webkit-mask-image: radial-gradient(ellipse 45% 70% at 22% 45%, #000 10%, transparent 75%);
      mask-image: radial-gradient(ellipse 45% 70% at 22% 45%, #000 10%, transparent 75%);
      pointer-events: none;
    }
    .hero-orb {
      position: absolute;
      z-index: 1;
      width: 700px; height: 700px;
      left: -200px; top: 45%;
      transform: translateY(-50%);
      background: radial-gradient(circle, rgba(24,201,130,.22), transparent 60%);
      pointer-events: none;
    }
    .hero > .wrap { position: relative; z-index: 2; width: 100%; }
    .hero-copy { max-width: 640px; }
    .hero-copy .chip { margin-bottom: 28px; }
    .hero h1 {
      font-size: clamp(36px, 5vw, 62px);
      line-height: 1.02;
      letter-spacing: -.04em;
      color: var(--ink);
      margin: 0 0 22px;
    }
    .hero-sub {
      font-size: 17.5px;
      line-height: 1.7;
      max-width: 560px;
      margin: 0 0 34px;
      color: var(--ink);
    }
    .hero-actions { display: flex; align-items: center; gap: 26px; flex-wrap: wrap; }

    .hero-tools {
      position: absolute;
      left: 50%;
      bottom: -32px;
      z-index: 6;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 8px;
      background: rgba(7,26,20,.84);
      border: 1px solid var(--line-2);
      border-radius: 18px;
      box-shadow: 0 1px 0 rgba(255,255,255,.06) inset, 0 30px 60px -20px rgba(0,0,0,.9);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      white-space: nowrap;
    }
    .hero-tools.rv { transform: translate(-50%, 18px); }
    .hero-tools.rv.in { transform: translate(-50%, 0); }
    .tool {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 10px 16px 10px 12px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      color: var(--ink);
    }
    .tool .ico { color: var(--accent-bright); width: 18px; height: 18px; }
    .tool + .tool { position: relative; }
    .tool + .tool::before {
      content: '';
      position: absolute;
      left: -2px; top: 10px; bottom: 10px;
      width: 1px;
      background: var(--line-2);
    }

    /* ── Seções ── */
    section { padding: 104px 0; position: relative; scroll-margin-top: 72px; }
    #diagnostico { scroll-margin-top: 92px; }
    .band-white { background: var(--paper-2); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .band-dark  { background: var(--dark); }
    .sec-head { margin-bottom: 56px; }
    .sec-head.center { text-align: center; }
    .sec-head .chip { margin-bottom: 20px; }
    .sec-head h2 {
      font-size: clamp(30px, 4vw, 48px);
      line-height: 1.08;
      letter-spacing: -.035em;
      max-width: 820px;
    }
    .sec-head.center h2 { margin: 0 auto; }
    .sec-head .lead {
      font-size: 16.5px;
      margin-top: 18px;
      max-width: 680px;
    }
    .sec-head.center .lead { margin-left: auto; margin-right: auto; }
    .cta-wrap { text-align: center; margin-top: 52px; }
    .cta-wrap--tight { margin-top: 32px; }
    .closing {
      text-align: center;
      font-size: 17px;
      line-height: 1.7;
      color: var(--ink);
      max-width: 720px;
      margin: 44px auto 0;
    }

    .giant {
      font-family: var(--serif);
      font-style: italic;
      font-weight: 400;
      line-height: .9;
      letter-spacing: -.03em;
      background: linear-gradient(180deg, #FFF1F6 0%, #FF8DB4 48%, rgba(24,201,130,.3) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
    }

    /* ── Experiência ── */
    .experiencia { padding-top: 136px; }
    .exp-grid {
      display: grid;
      grid-template-columns: .9fr 1.4fr;
      gap: 18px;
      align-items: stretch;
    }
    .exp-card {
      position: relative;
      overflow: hidden;
      background: linear-gradient(180deg, var(--surface), var(--paper-2));
      border: 1px solid var(--line);
      border-radius: var(--r-card);
      padding: 34px 30px 30px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      min-height: 280px;
      box-shadow: var(--shadow-card);
    }
    .exp-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
      background-size: 40px 40px;
      -webkit-mask-image: radial-gradient(ellipse 80% 80% at 80% 0%, #000, transparent 70%);
      mask-image: radial-gradient(ellipse 80% 80% at 80% 0%, #000, transparent 70%);
      pointer-events: none;
    }
    .exp-card > * { position: relative; }
    .exp-card .giant { font-size: clamp(96px, 10vw, 150px); margin-bottom: 12px; }
    .exp-card .unit {
      font-family: var(--display);
      font-weight: 700;
      font-size: 24px;
      letter-spacing: -.02em;
      color: var(--ink);
    }
    .exp-card .lbl {
      font-size: 12px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--faint);
      margin-top: 8px;
      line-height: 1.5;
    }
    .joe-card {
      position: relative;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r-card);
      display: grid;
      grid-template-columns: 220px 1fr;
      box-shadow: var(--shadow-card);
    }
    .joe-card picture { position: relative; }
    .joe-card picture::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(23,15,32,0) 70%, var(--surface) 100%);
    }
    .joe-card img { width: 100%; height: 100%; object-fit: cover; object-position: center top; }
    .joe-card-body { padding: 34px 34px 32px 26px; display: flex; flex-direction: column; justify-content: center; }
    .joe-card h3 {
      font-family: var(--display);
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -.03em;
      line-height: 1.05;
      color: var(--ink);
      margin-bottom: 20px;
    }
    .check-list { list-style: none; display: flex; flex-direction: column; gap: 14px; }
    .check-list li {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      font-size: 15px;
      line-height: 1.55;
      color: var(--ink);
    }
    .check-list .ck-ico { margin-top: 1px; }
    .ck-ico {
      width: 22px; height: 22px;
      border-radius: 50%;
      background: var(--pink-pale);
      color: var(--accent-bright);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .ck-ico--warm { background: var(--warm-bg); color: var(--warm); }
    .exp-note {
      text-align: center;
      font-size: 16.5px;
      line-height: 1.75;
      max-width: 720px;
      margin: 0 auto 44px;
    }

    /* ── Cards genéricos (dores · frentes) ── */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }
    .card {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 28px 26px 26px;
      transition: transform .25s var(--ease), box-shadow .25s var(--ease), border-color .25s;
      overflow: hidden;
    }
    .card::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 0% 0%, rgba(24,201,130,.16), transparent 55%);
      opacity: 0;
      transition: opacity .3s;
      pointer-events: none;
    }
    .card:hover { transform: translateY(-4px); border-color: var(--pink-line); box-shadow: var(--shadow-card); }
    .card:hover::after { opacity: 1; }
    .card--warm::after { background: radial-gradient(circle at 100% 0%, rgba(24,201,130,.14), transparent 55%); }
    .card--warm:hover { border-color: var(--warm-line); }
    .card .tile { margin-bottom: 20px; }
    .card h3 { font-size: 18px; font-weight: 600; letter-spacing: -.015em; line-height: 1.35; margin-bottom: 9px; }
    .card p { font-size: 14.5px; line-height: 1.62; }
    .tagline {
      text-align: center;
      font-family: var(--serif);
      font-style: italic;
      font-size: clamp(28px, 3.4vw, 40px);
      color: var(--ink);
      margin-top: 48px;
      letter-spacing: -.01em;
    }
    .tagline .em { font-size: 1em; }

    /* ── Etapas · blocos alternados ── */
    .steps { position: relative; display: flex; flex-direction: column; gap: 22px; }
    .step-row {
      display: grid;
      grid-template-columns: .8fr 1.2fr;
      gap: 22px;
      align-items: stretch;
    }
    .step-row.flip { grid-template-columns: 1.2fr .8fr; }
    .step-row.flip .step-big { order: 2; }
    .step-row.flip .step-card { order: 1; }
    .step-big {
      position: relative;
      overflow: hidden;
      min-height: 300px;
      border-radius: var(--r-card);
      background: linear-gradient(135deg, #0D2A22 0%, #071A14 100%);
      border: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 32px;
      text-align: center;
      box-shadow: var(--shadow-card);
    }
    .step-big::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
      background-size: 44px 44px;
      -webkit-mask-image: radial-gradient(ellipse 70% 90% at 50% 50%, #000 10%, transparent 75%);
      mask-image: radial-gradient(ellipse 70% 90% at 50% 50%, #000 10%, transparent 75%);
    }
    .step-big::after {
      content: '';
      position: absolute;
      width: 420px; height: 420px;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(24,201,130,.26), transparent 60%);
      pointer-events: none;
    }
    .step-big > * { position: relative; z-index: 1; }
    .step-big .giant { font-size: clamp(110px, 11vw, 160px); }
    .step-big .step-name {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--accent-bright);
    }
    .step-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r-card);
      padding: 36px 36px 34px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      transition: border-color .25s;
    }
    .step-card:hover { border-color: var(--pink-line); }
    .step-card .chip { align-self: flex-start; margin-bottom: 18px; }
    .step-card h3 { font-size: 23px; font-weight: 600; letter-spacing: -.02em; line-height: 1.25; margin-bottom: 12px; }
    .step-card > p { font-size: 15px; line-height: 1.68; margin-bottom: 22px; }
    .deliv-label {
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--faint);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .deliv-label::after { content: ''; flex: 1; height: 1px; background: var(--line); }
    .deliv {
      list-style: none;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px 16px;
    }
    .deliv li {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      font-size: 14px;
      line-height: 1.5;
      color: var(--ink);
    }
    .deliv .ck-ico { width: 18px; height: 18px; margin-top: 2px; }

    /* ── Da prioridade à rotina ── */
    .shift-list { display: flex; flex-direction: column; gap: 12px; }
    .shift {
      display: grid;
      grid-template-columns: 1fr 56px 1.4fr;
      align-items: center;
      gap: 20px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 22px 28px;
      transition: border-color .25s, transform .25s var(--ease);
    }
    .shift:hover { border-color: var(--pink-line); transform: translateX(4px); }
    .shift .from {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 17px;
      font-weight: 600;
      color: var(--ink);
      letter-spacing: -.015em;
      line-height: 1.3;
    }
    .shift .to { font-size: 15px; line-height: 1.6; }
    .shift-arrow {
      width: 44px; height: 44px;
      border-radius: 50%;
      background: var(--pink-pale);
      border: 1px solid var(--pink-line);
      color: var(--accent-bright);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      justify-self: center;
    }

    /* ── Para quem ── */
    .fit-card {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--pink-line);
      border-radius: var(--r-card);
      padding: 40px 40px 36px;
      overflow: hidden;
      max-width: 880px;
      margin: 0 auto;
    }
    .fit-card::before {
      content: '';
      position: absolute;
      inset: 0 0 auto 0;
      height: 260px;
      background: radial-gradient(ellipse 70% 60% at 0% 0%, rgba(24,201,130,.18), transparent 70%);
      pointer-events: none;
    }
    .fit-card > * { position: relative; }
    .fit-card .check-list { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 24px; }
    .fit-note {
      margin-top: 28px;
      padding-top: 22px;
      border-top: 1px dashed var(--line-2);
      font-size: 15px;
      color: var(--ink);
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }
    .fit-note .ico { color: var(--accent-bright); margin-top: 3px; }

    /* ── Joe ── */
    .band-dark { color: var(--body-c); }
    .author-box {
      display: grid;
      grid-template-columns: 400px 1fr;
      gap: 56px;
      align-items: center;
    }
    .author-avatar {
      position: relative;
      aspect-ratio: 4 / 5;
      border-radius: 26px;
      background: linear-gradient(180deg, #0D2A22, #071A14);
      border: 1px solid var(--line-2);
      overflow: hidden;
      box-shadow: var(--shadow-card);
    }
    .author-avatar picture { position: absolute; inset: 0; }
    .author-avatar img { width: 100%; height: 100%; object-fit: cover; object-position: center top; }
    .author-avatar::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(7,26,20,0) 55%, rgba(7,26,20,.88) 100%);
      pointer-events: none;
    }
    .author-badge {
      position: absolute;
      z-index: 2;
      left: 20px; bottom: 20px;
      display: inline-flex;
      align-items: center;
      padding: 10px 14px;
      border-radius: 14px;
      background: rgba(7,26,20,.8);
      border: 1px solid var(--line-2);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .author-badge img { height: 26px; width: auto; }
    .author-info .chip { margin-bottom: 24px; }
    .author-info h2 {
      font-size: clamp(30px, 3.6vw, 44px);
      letter-spacing: -.035em;
      line-height: 1.08;
      color: var(--ink);
      margin-bottom: 20px;
    }
    .author-info > p { font-size: 15.5px; line-height: 1.75; max-width: 580px; }
    .author-info > p + p { margin-top: 14px; }
    .author-info > p strong { color: var(--ink); font-weight: 600; }
    .author-info .btn { margin-top: 30px; }

    /* ── Como o trabalho ganha forma ── */
    .proof-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }
    .proof-thumb {
      position: relative;
      margin: 0;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid var(--line-2);
      background: var(--surface);
      box-shadow: var(--shadow-card);
      transition: transform .3s var(--ease), border-color .3s;
    }
    .proof-thumb:hover { transform: translateY(-5px); border-color: var(--pink-line); }
    .proof-thumb img { width: 100%; height: auto; aspect-ratio: 1320 / 900; object-fit: cover; }
    .proof-thumb .chip {
      position: absolute;
      top: 12px; right: 12px;
      padding: 5px 10px 5px 8px;
      font-size: 10px;
      background: rgba(7,26,20,.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    /* ── FAQ ── */
    .faq-list { display: flex; flex-direction: column; gap: 10px; }
    .faq-item {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      transition: border-color .2s, background .2s;
    }
    .faq-item[open] { border-color: var(--pink-line); background: var(--surface-2); }
    .faq-item summary {
      list-style: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 20px 22px 20px 24px;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -.01em;
      color: var(--ink);
    }
    .faq-item summary::-webkit-details-marker { display: none; }
    .faq-item summary .q { flex: 1; }
    .faq-item summary .pm {
      width: 30px; height: 30px;
      border-radius: 50%;
      background: var(--pink-pale);
      border: 1px solid var(--pink-line);
      color: var(--accent-bright);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform .25s var(--ease), background .2s;
    }
    .faq-item[open] summary .pm { transform: rotate(45deg); background: var(--accent); color: var(--ink); }
    .faq-item .ans { padding: 0 24px 22px 24px; font-size: 15px; line-height: 1.7; max-width: 720px; }

    /* ── Próximo passo · etapas + formulário ── */
    .timeline { max-width: 1040px; margin: 0 auto; }
    .how-label {
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--faint);
      margin-bottom: 28px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .how-label::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--line-2), transparent); }
    .tl {
      list-style: none;
      position: relative;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 28px;
    }
    .tl::before {
      content: '';
      position: absolute;
      left: 26px; right: 26px; top: 25px;
      height: 2px;
      background: linear-gradient(90deg, var(--pink-line), var(--accent) 50%, var(--pink-line));
      box-shadow: 0 0 18px rgba(24,201,130,.45);
    }
    .tl li { position: relative; padding-top: 74px; }
    .tl-node {
      position: absolute;
      top: 0; left: 0;
      width: 52px; height: 52px;
      border-radius: 50%;
      background: var(--dark);
      border: 1px solid var(--accent);
      box-shadow: 0 0 0 8px rgba(24,201,130,.08), 0 0 28px rgba(24,201,130,.4);
      color: var(--accent-bright);
      font-family: var(--serif);
      font-style: italic;
      font-size: 26px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .tl strong { display: block; color: var(--ink); font-size: 17px; font-weight: 600; letter-spacing: -.015em; line-height: 1.3; margin-bottom: 6px; }
    .tl span:not(.tl-node) { font-size: 14.5px; line-height: 1.6; }

    .form-card {
      --c-ink: #17201D;
      --c-body: #4C5652;
      --c-faint: #6E7773;
      position: relative;
      z-index: 1;
      max-width: 640px;
      margin: 0 auto;
      background: linear-gradient(180deg, #FFFFFF 0%, #F5F7F4 100%);
      color: var(--c-body);
      border-radius: 26px;
      padding: 34px;
      box-shadow: 0 2px 6px rgba(0,0,0,.4), 0 50px 90px -30px rgba(0,0,0,.95), 0 0 0 1px rgba(255,255,255,.35) inset;
    }
    .form-card .chip { background: rgba(24,201,130,.12); border-color: rgba(24,201,130,.32); color: #0B7F50; margin-bottom: 18px; }
    .form-card h3 { color: var(--c-ink); font-family: var(--display); font-size: 24px; font-weight: 700; letter-spacing: -.028em; line-height: 1.15; margin-bottom: 24px; }
    .form-card h3 .em { color: #0B7F50; }
    .field { display: flex; flex-direction: column; gap: 7px; margin-bottom: 16px; }
    .field label { font-size: 13px; font-weight: 600; color: var(--c-ink); letter-spacing: -.005em; }
    .field label .opt { font-weight: 500; color: var(--c-faint); }
    .field input[type="text"], .field input[type="email"], .field input[type="tel"] {
      font-family: var(--sans);
      font-size: 15px;
      color: var(--c-ink);
      background: #fff;
      border: 1px solid rgba(20,6,13,.14);
      border-radius: 12px;
      padding: 13px 14px;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    .field input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(24,201,130,.14); }
    .field input::placeholder { color: #9AA39F; }
    .radio-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .radio {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 500;
      color: var(--c-ink);
      background: rgba(20,6,13,.04);
      border: 1px solid rgba(20,6,13,.08);
      border-radius: 12px;
      padding: 11px 12px;
      cursor: pointer;
      transition: border-color .2s, background .2s;
    }
    .radio:has(input:checked) { border-color: var(--accent); background: rgba(24,201,130,.08); }
    .radio input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
    .form-card .btn { margin-top: 8px; min-height: 54px; font-size: 16px; }
    .form-legal { font-size: 12.5px; line-height: 1.55; color: var(--c-faint); margin-top: 14px; text-align: center; }
    .form-legal a { color: #0B7F50; font-weight: 600; text-decoration: none; }
    .form-success {
      display: none;
      text-align: center;
      padding: 36px 10px;
    }
    .form-success .tile { margin: 0 auto 18px; color: #0B7F50; background: rgba(24,201,130,.1); border-color: rgba(24,201,130,.3); }
    .form-success .tile::after { display: none; }
    .form-success strong { display: block; color: var(--c-ink); font-family: var(--display); font-size: 24px; letter-spacing: -.025em; margin-bottom: 10px; }
    .form-success p { font-size: 15.5px; line-height: 1.65; }
    .form-card.is-sent form { display: none; }
    .form-card.is-sent .form-success { display: block; }

    .access-band {
      position: relative;
      margin-top: 72px;
      padding: 72px 0;
      overflow: hidden;
    }
    .marquee {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      gap: 14px;
      padding: 10px 0;
      -webkit-mask-image: linear-gradient(90deg, transparent, #000 15%, #000 85%, transparent);
      mask-image: linear-gradient(90deg, transparent, #000 15%, #000 85%, transparent);
      pointer-events: none;
      opacity: .75;
    }
    .marquee-row { overflow: hidden; white-space: nowrap; }
    .marquee-track { display: inline-flex; gap: 12px; padding-right: 12px; animation: marquee 46s linear infinite; }
    .marquee-row:nth-child(2) .marquee-track { animation-duration: 58s; animation-direction: reverse; }
    .marquee-row:nth-child(3) .marquee-track { animation-duration: 52s; }
    .marquee-row:nth-child(4) .marquee-track { animation-duration: 64s; animation-direction: reverse; }
    .marquee-row:nth-child(5) .marquee-track { animation-duration: 70s; }
    .marquee-row:nth-child(6) .marquee-track { animation-duration: 56s; animation-direction: reverse; }
    .mq {
      display: inline-flex;
      align-items: center;
      padding: 9px 18px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.025);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: rgba(255,255,255,.34);
    }
    @keyframes marquee { to { transform: translateX(-50%); } }
    @media (prefers-reduced-motion: reduce) { .marquee-track { animation: none; } }

    .help-strip {
      margin-top: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px 28px;
      flex-wrap: wrap;
      background: var(--paper-2);
      border: 1px dashed var(--line-2);
      border-radius: 18px;
      padding: 24px 28px;
    }
    .help-strip h3 {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--ink);
    }
    .help-strip h3 .tile { width: 36px; height: 36px; border-radius: 11px; }
    .help-txt { flex: 1 1 320px; }
    .help-txt p { font-size: 14.5px; margin-top: 8px; }
    .help-txt .num { display: inline-flex; align-items: center; gap: 8px; margin-top: 10px; font-weight: 600; color: var(--ink); }
    .help-txt .num .ico { color: #3EE07F; width: 16px; height: 16px; }

    /* ── Rodapé ── */
    footer {
      position: relative;
      padding: 56px 0 40px;
      font-size: 13.5px;
      color: var(--faint);
      border-top: 1px solid var(--line);
    }
    footer::before {
      content: '';
      position: absolute;
      top: -1px; left: 50%;
      width: 360px; height: 1px;
      transform: translateX(-50%);
      background: linear-gradient(90deg, transparent, var(--accent-bright), transparent);
    }
    .footer-grid {
      display: grid;

    /* ════════ Acelerador · Consultores (extensões) ════════ */

    /* VSL */
    .vsl-intro { max-width: 760px; margin: 0 auto 40px; text-align: center; }
    .vsl-intro p { font-size: 16.5px; line-height: 1.75; }
    .vsl-intro p + p { margin-top: 14px; }
    .vsl {
      position: relative;
      max-width: 940px;
      margin: 0 auto;
      aspect-ratio: 16 / 9;
      border-radius: 26px;
      overflow: hidden;
      border: 1px solid var(--line-2);
      background: linear-gradient(135deg, #0D2A22 0%, #071A14 100%);
      box-shadow: var(--shadow-card), 0 0 0 8px rgba(24,201,130,.06);
    }
    .vsl::before {
      content: '';
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
      background-size: 48px 48px;
      -webkit-mask-image: radial-gradient(ellipse 60% 80% at 50% 50%, #000 10%, transparent 75%);
      mask-image: radial-gradient(ellipse 60% 80% at 50% 50%, #000 10%, transparent 75%);
    }
    .vsl::after {
      content: '';
      position: absolute;
      width: 520px; height: 520px;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(24,201,130,.28), transparent 60%);
      pointer-events: none;
    }
    .vsl-poster { position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%; object-fit: cover; object-position: 70% 20%; opacity: .5; filter: saturate(.6); }
    .vsl-play {
      position: absolute; inset: 0; z-index: 2;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
      background: none; border: 0; cursor: pointer; color: var(--ink); font-family: var(--sans);
    }
    .vsl-play .pl {
      width: 88px; height: 88px; border-radius: 50%;
      background: var(--accent);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 0 12px rgba(24,201,130,.18), 0 20px 50px -10px rgba(24,201,130,.8);
      transition: transform .25s var(--ease);
    }
    .vsl-play:hover .pl { transform: scale(1.07); }
    .vsl-play .pl svg { width: 34px; height: 34px; fill: #fff; stroke: #fff; margin-left: 4px; }
    .vsl-play .lbl { font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--ink); }
    .vsl iframe, .vsl video { position: absolute; inset: 0; z-index: 3; width: 100%; height: 100%; border: 0; background: #000; }
    .vsl.is-empty .vsl-play { cursor: default; }
    .vsl.is-empty .pl { opacity: .55; box-shadow: none; }
    .vsl.is-empty:hover .pl { transform: none; }

    /* Perfis */

    .card--row .tile { margin-bottom: 0; grid-row: span 2; }

    .stuck > * { position: relative; }

    /* Oito ativos */

    .asset .res-txt { font-size: 13.5px; line-height: 1.5; color: var(--ink); font-weight: 500; }

      margin-top: 22px;

    .recap p { color: var(--ink); font-weight: 600; font-size: 15.5px; line-height: 1.7; max-width: 820px; margin: 0 auto; }

    /* Ativação comercial */
    .market-head { margin: 76px 0 36px; text-align: center; }
    .market-head h3 { font-family: var(--display); font-size: clamp(24px, 3vw, 34px); font-weight: 700; letter-spacing: -.03em; line-height: 1.12; color: var(--ink); max-width: 760px; margin: 0 auto 16px; }
    .market-head p { max-width: 680px; margin: 0 auto; font-size: 16px; }
    .market-head p + p { margin-top: 10px; color: var(--ink); font-weight: 600; }
    .card-grid--5 { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; }
    .card-grid--5 .card { grid-column: span 2; }

    .tl-sub { display: block; color: var(--ink); font-weight: 600; font-size: 13.5px; line-height: 1.45; margin-bottom: 8px; }

    .tl-node { font-style: normal; font-family: var(--display); font-weight: 700; font-size: 17px; letter-spacing: -.02em; }
    .tl li > span:last-child { display: block; }

    /* Joe · números e logos */
    .joe-stats { display: grid; grid-template-columns: repeat(3, auto); justify-content: start; gap: 12px 34px; margin: 26px 0 0; }
    .joe-stats div { display: flex; flex-direction: column; gap: 4px; }
    .joe-stats .n svg { width: 40px; height: 40px; color: var(--accent-bright); stroke-width: 1.4; }
    .joe-stats .n { font-family: var(--serif); font-style: italic; font-size: 46px; line-height: 1; color: var(--accent-bright); }
    .joe-stats .l { font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
    .author-info .lead-sm { font-size: 15.5px; line-height: 1.75; max-width: 580px; }
    .orgs { margin-top: 84px; }
    .orgs h3 { text-align: center; font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); margin-bottom: 26px; display: flex; align-items: center; gap: 18px; }
    .orgs h3::before, .orgs h3::after { content: ''; flex: 1; height: 1px; background: var(--line-2); }
    .logo-marquee {
      overflow: hidden; white-space: nowrap;

      mask-image: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent);

    /* Sustentação + FAQ */

    /* ════════ Referência de diagramação · hero estilo "Apogee" ════════ */
    /* Cabeçalho: logo + pílula central + pílula de CTA, sobre a hero */
    .site-head { position: fixed; top: 0; left: 0; right: 0; background: transparent; border-bottom: 1px solid transparent; backdrop-filter: none; -webkit-backdrop-filter: none; transition: background .3s, border-color .3s; }

    .vsl-intro p { font-size: clamp(16px, 1.5vw, 19px); font-weight: 450; line-height: 1.45; color: rgba(255,255,255,.8); }

    /* Cards sem efeito de hover */
    .card, .card:hover { transition: none; transform: none; box-shadow: none; border-color: var(--line); }
    .card::after, .card:hover::after { display: none; }
    .card--warm:hover { border-color: var(--line); }

    /* Recap sem container */
    .recap { background: none; border: 0; padding: 0; margin-top: 48px; }
    /* Hover só em elementos que chamam para ação */
    .logo-marquee:hover .logo-track { animation-play-state: running; }
    .proof-thumb:hover, .shift:hover, .step-card:hover { transform: none; border-color: var(--line); }

    /* Faixa de logos monocromáticos */
    .logo-track { gap: 0; padding-right: 0; align-items: center; }
    .org { padding: 0 34px; border: 0; background: none; border-radius: 0; height: 52px; }
    .org img { height: 34px; width: auto; max-width: 170px; object-fit: contain; opacity: .72; }
    .logo-marquee { -webkit-mask-image: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent); mask-image: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent); }
    @media (max-width: 560px) { .org { padding: 0 24px; } .org img { height: 28px; max-width: 130px; } }

    /* Faixa de logos no pé da hero */
    @media (min-width: 961px) {
      .hero { min-height: 92vh; flex-direction: column; align-items: stretch; justify-content: center; padding: 130px 0 0; }
      .hero > .wrap:not(.hero-orgs) { flex: 1; display: flex; align-items: center; }
    }
    .hero-orgs { position: relative; z-index: 2; padding-top: 0; padding-bottom: 64px; margin-top: 36px; }
    .hero-orgs-label { text-align: center; font-size: 11.5px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); margin-bottom: 14px; display: flex; align-items: center; gap: 18px; }
    .hero-orgs-label::before, .hero-orgs-label::after { content: ''; flex: 1; height: 1px; background: var(--line-2); }
    @media (max-width: 960px) { .hero-orgs { padding-bottom: 0; margin-top: 28px; } }
    @media (max-width: 960px) {
      .hero { display: flex; flex-direction: column; }
      .hero > .hero-orgs { flex: none; display: block; order: 3; margin-top: 24px; padding-bottom: 0; }
      .hero > .hero-tools, .hero > .hero-tools.rv, .hero > .hero-tools.rv.in { order: 2; }
      .hero-orgs-label { white-space: nowrap; }
    }

    /* ════════ Direção cromática do briefing · verde tecnológico ════════
       Base clara (off-white/branco) · seções estratégicas em verde escuro
       Verde vibrante em CTAs, indicadores, linhas e ícones · grafite no texto */
    :root {
      --paper:      #F5F7F4;
      --paper-2:    #FFFFFF;
      --surface:    #FFFFFF;
      --surface-2:  #DDF8EC;
      --ink:        #17201D;
      --ink-2:      #071A14;
      --body-c:     #4C5652;
      --faint:      #6E7773;
      --line:       rgba(23,32,29,.10);
      --line-2:     rgba(23,32,29,.18);
      --grid:       rgba(23,32,29,.05);
      --pink-pale:  #DDF8EC;
      --pink-line:  rgba(24,201,130,.45);
      --pink-soft:  rgba(24,201,130,.10);
      --accent:     #18C982;
      --accent-bright: #0B7F50;
      --accent-soft:#DDF8EC;
      --warm:       #0B7F50;
      --warm-bg:    #DDF8EC;
      --warm-line:  rgba(24,201,130,.45);
      --warm-deep:  #0B7F50;
      --dark:       #071A14;
      --display: 'Inter Tight', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      --serif:   'Barlow Condensed', 'Arial Narrow', sans-serif;
      --shadow-card: 0 1px 2px rgba(23,32,29,.05), 0 22px 44px -30px rgba(23,32,29,.28);
    }
    .t-dark {
      --paper:      #071A14;
      --paper-2:    #0D2A22;
      --surface:    #0D2A22;
      --surface-2:  #123A2E;
      --ink:        #FFFFFF;
      --body-c:     #B7C6BF;
      --faint:      #8DA097;
      --line:       rgba(255,255,255,.10);
      --line-2:     rgba(255,255,255,.18);
      --grid:       rgba(255,255,255,.045);
      --pink-pale:  rgba(24,201,130,.14);
      --pink-line:  rgba(24,201,130,.38);
      --pink-soft:  rgba(24,201,130,.08);
      --accent-bright: #45E6A6;
      --warm:       #45E6A6;
      --warm-bg:    rgba(24,201,130,.14);
      --warm-line:  rgba(24,201,130,.38);
      --warm-deep:  #45E6A6;
      --shadow-card: 0 1px 2px rgba(0,0,0,.3), 0 24px 60px -30px rgba(0,0,0,.7);
      background: var(--paper);
      color: var(--body-c);
    }
    body { background: var(--paper); color: var(--body-c); }
    ::selection { background: var(--accent); color: #071A14; }
    section.t-dark { border: 0; }
    footer.t-dark { --paper: #17201D; background: #17201D; }
    .site-head.t-dark { background: transparent; }
    .site-head.t-dark.scrolled { background: rgba(7,26,20,.92); }
    .band-white { background: var(--paper-2); }

    /* Tipografia: títulos de peso alto, números condensados */
    h1, h2, .market-head h3, .faq-sub, .stuck h3 { font-family: var(--display); font-weight: 700; letter-spacing: -.035em; }
    .hero h1 { font-weight: 700; line-height: 1; letter-spacing: -.04em; }
    @media (min-width: 1024px) { .hero h1 { font-size: 68px; } }
    .sec-head h2, .author-info h2 { line-height: 1.04; }
    .market-head h3, .faq-sub { line-height: 1.06; }
    .em { font-family: inherit; font-style: normal; font-weight: inherit; font-size: 1em; letter-spacing: inherit; color: var(--accent-bright); }
    .recap h3 { font-family: var(--display); font-style: normal; font-weight: 700; letter-spacing: -.03em; font-size: clamp(20px, 2.2vw, 26px); color: var(--ink); }
    .asset .num, .joe-stats .n, .tl-node { font-family: var(--serif); font-style: normal; font-weight: 600; letter-spacing: 0; }
    .asset .num { font-size: 40px; opacity: 1; }
    .joe-stats .n { font-size: 58px; }
    .tl-node { font-size: 24px; }

    /* Fundo: grid e glow discretos */
    .has-grid::before { background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); }
    .has-glow::after { background: radial-gradient(circle, rgba(24,201,130,.09), transparent 62%); }

    /* Botões: verde vibrante com texto escuro */
    .btn, .btn--light, .head-cta.btn { background: var(--accent); color: #071A14; font-weight: 600; }
    .btn:hover, .btn--light:hover, .head-cta.btn:hover { background: #45E6A6; }
    .head-pill { background: rgba(0,0,0,.28); }
    .faq-item[open] summary .pm { color: #071A14; }
    .vsl-play .pl svg { fill: #071A14; stroke: #071A14; }
    .vsl-play .pl { box-shadow: 0 0 0 10px rgba(24,201,130,.16); }
    .vsl { box-shadow: var(--shadow-card); border-color: var(--line-2); }

    /* Ícones lineares em placa sólida, sem brilho */
    .tile { background: var(--pink-pale); border: 1px solid var(--pink-line); box-shadow: none; color: var(--accent-bright); }
    .tile::after { display: none; }

    /* Chips como rótulo técnico, não como selo */
    .chip { background: transparent; border: 0; padding: 0; border-radius: 0; color: var(--accent-bright); letter-spacing: .14em; }
    .chip::before { content: ''; width: 22px; height: 1px; background: currentColor; flex: none; }
    .chip .ico { display: none; }
    .hero-copy .chip { align-items: flex-start; }
    .hero-copy .chip::before { margin-top: .6em; }

    /* Hero */
    .hero-bg img { filter: grayscale(.85) contrast(1.05); }
    .hero-clip::before {
      background:
        linear-gradient(90deg, rgba(7,26,20,.97) 0%, rgba(7,26,20,.86) 40%, rgba(7,26,20,.38) 66%, rgba(7,26,20,.2) 100%),
        linear-gradient(180deg, rgba(24,201,130,.10) 0%, rgba(7,26,20,0) 40%, rgba(7,26,20,.9) 100%),
        linear-gradient(0deg, rgba(13,42,34,.45), rgba(13,42,34,.45));
    }
    .hero-orb { background: radial-gradient(circle, rgba(24,201,130,.12), transparent 60%); }
    .hero-tools { backdrop-filter: none; -webkit-backdrop-filter: none; background: #0D2A22; }
    @media (max-width: 960px) {
      .hero-clip::before { background: linear-gradient(180deg, rgba(7,26,20,.97) 0%, rgba(7,26,20,.86) 36%, rgba(7,26,20,.25) 50%, rgba(7,26,20,.05) 60%, rgba(7,26,20,.2) 74%, rgba(7,26,20,.88) 100%), linear-gradient(0deg, rgba(13,42,34,.4), rgba(13,42,34,.4)); }
    }

    /* Linha do tempo */
    .tl-node { background: var(--surface); box-shadow: 0 0 0 7px var(--pink-soft); }
    .tl::before { box-shadow: none; }

    /* Blocos */
    .stuck { background: var(--pink-pale); border-color: var(--pink-line); box-shadow: none; }
    .stuck::before { display: none; }
    .stuck .closing-line { border-top-color: var(--pink-line); }
    .fit-card { border-color: var(--line-2); box-shadow: var(--shadow-card); }
    .fit-card::before { display: none; }
    .author-avatar { box-shadow: none; }
    .author-avatar img { filter: grayscale(.25); }
    .org img { opacity: .8; }
    .form-card { box-shadow: 0 30px 70px -30px rgba(0,0,0,.6); background: #FFFFFF; }

    /* Textos de apoio seguem a cor do contexto (claro ou escuro) */
    .sec-head .lead, .vsl-intro p { color: var(--body-c); }
    .hero-sub { color: rgba(255,255,255,.82); }
    /* Hero: foto do Joe mais legível, tinta verde só de leve */
    .hero-clip::before {
      background:
        linear-gradient(90deg, rgba(7,26,20,.97) 0%, rgba(7,26,20,.84) 38%, rgba(7,26,20,.22) 64%, rgba(7,26,20,.08) 100%),
        linear-gradient(180deg, rgba(24,201,130,.06) 0%, rgba(7,26,20,0) 40%, rgba(7,26,20,.92) 100%),
        linear-gradient(0deg, rgba(13,42,34,.2), rgba(13,42,34,.2));
    }
    .hero-bg img { filter: grayscale(.7) contrast(1.04); }
    @media (max-width: 960px) {
      .hero-clip::before { background: linear-gradient(180deg, rgba(7,26,20,.97) 0%, rgba(7,26,20,.86) 36%, rgba(7,26,20,.2) 50%, rgba(7,26,20,0) 60%, rgba(7,26,20,.12) 74%, rgba(7,26,20,.8) 100%), linear-gradient(0deg, rgba(13,42,34,.14), rgba(13,42,34,.14)); }
    }
    /* Rótulos sem o travessão */
    .chip::before { display: none; }

    /* ════════ Briefing mobile · experiência própria (≤ 960px) ════════ */
    .only-mob { display: none; }
    .vsl-poster { opacity: .9; object-position: center; filter: none; }
    .vsl::before, .vsl::after { display: none; }
    .vsl-dur { position: absolute; z-index: 2; right: 12px; bottom: 12px; padding: 4px 9px; border-radius: 7px; background: rgba(7,26,20,.82); color: #fff; font-size: 12.5px; font-weight: 600; letter-spacing: .02em; }
    .vsl:has(video) .vsl-dur, .vsl:has(iframe) .vsl-dur { display: none; }
    .vsl-play { background: linear-gradient(180deg, rgba(7,26,20,.05), rgba(7,26,20,.45)); }

    /* Hero desktop: foto como fundo em CSS, para não baixar no celular */
    @media (min-width: 961px) {
      .hero-bg { background: url(../../assets/hero-desktop.jpg) 72% 30% / cover no-repeat; filter: grayscale(.7) contrast(1.04); }
    }

    /* Recap: em linha no desktop, lista vertical no mobile */
    .recap-list { list-style: none; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 0; max-width: 860px; margin: 0 auto; color: var(--ink); font-weight: 600; font-size: 15.5px; line-height: 1.6; }
    .recap-list li { display: inline-flex; align-items: center; }
    .recap-list .ck-ico { display: none; }
    .recap-list li + li::before { content: '·'; margin: 0 9px; color: var(--accent-bright); }

    /* Accordion dos 8 ativos */
    .acc { display: flex; flex-direction: column; gap: 8px; }
    .acc-item { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
    .acc-item[open] { border-color: var(--pink-line); }
    .acc-item summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 38px 1fr 30px; gap: 12px; align-items: center; padding: 16px 14px 16px 16px; min-height: 64px; -webkit-tap-highlight-color: transparent; }
    .acc-item summary::-webkit-details-marker { display: none; }
    .acc-item .num { font-family: var(--serif); font-weight: 600; font-size: 30px; line-height: 1; color: var(--accent-bright); }
    .acc-item .tt strong { display: block; color: var(--ink); font-size: 16.5px; font-weight: 600; letter-spacing: -.01em; line-height: 1.25; }
    .acc-item .tt small { display: block; margin-top: 4px; font-size: 13.5px; line-height: 1.4; color: var(--body-c); }
    .acc-item .pm { width: 30px; height: 30px; border-radius: 50%; background: var(--pink-pale); border: 1px solid var(--pink-line); color: var(--accent-bright); display: inline-flex; align-items: center; justify-content: center; transition: transform .25s var(--ease); }
    .acc-item[open] .pm { transform: rotate(45deg); background: var(--accent); color: #071A14; }
    .acc-item > p { padding: 0 16px 18px 66px; font-size: 14.5px; line-height: 1.6; }

    /* CTA fixo */
    .sticky-cta { display: none; }

    @media (max-width: 960px) {
      .only-desk { display: none !important; }
      .only-mob { display: flex; }

      /* Topo: só o logo, rolando com a página */
      .site-head, .site-head.scrolled { position: absolute; background: transparent; border-bottom-color: transparent; backdrop-filter: none; -webkit-backdrop-filter: none; }
      .site-head .head-pill { display: none; }
      .head-row, .site-head.scrolled .head-row { padding-top: 18px; padding-bottom: 0; justify-content: flex-start; }
      .head-logo img { height: 34px; }

      /* Hero: eyebrow → título → subtítulo → VSL → CTA → microprovas */
      .hero { display: block; min-height: 0; padding: 78px 0 36px; }
      .hero > .wrap:not(.hero-orgs) { display: block; flex: none; }
      .hero-copy { display: block; flex: none; max-width: none; }
      .hero-bg { display: none; }
      .hero-clip::before { background: linear-gradient(180deg, rgba(24,201,130,.07) 0%, rgba(7,26,20,0) 55%); }
      .hero-clip::after { -webkit-mask-image: linear-gradient(180deg, #000, transparent 70%); mask-image: linear-gradient(180deg, #000, transparent 70%); }
      .hero-orb { display: none; }
      .hero-copy .chip { font-size: 10.5px; letter-spacing: .12em; margin-bottom: 14px; }
      .hero h1 { font-size: clamp(30px, 8.6vw, 44px); line-height: 1.04; margin-bottom: 14px; }
      .hero-sub { font-size: 16px; line-height: 1.5; max-width: 560px; margin-bottom: 20px; }
      .vsl-slot#vsl-slot-hero { margin-bottom: 16px; }
      .vsl { border-radius: 14px; box-shadow: none; }
      .vsl-play .pl { width: 64px; height: 64px; }
      .vsl-play .pl svg { width: 26px; height: 26px; }
      .hero-cta { margin-top: 0; padding-top: 0; }
      .hero-actions { display: block; }
      .hero-actions .btn { width: 100%; height: 56px; font-size: 16.5px; }
      .hero > .hero-orgs { display: none; }
      .hero > .hero-tools, .hero > .hero-tools.rv, .hero > .hero-tools.rv.in {
        position: relative; left: auto; bottom: auto; transform: none;
        display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
        margin: 18px 20px 0; padding: 0; background: none; border: 0; border-radius: 0; box-shadow: none; white-space: normal;
      }
      .tool { align-items: flex-start; gap: 8px; padding: 11px 10px; border: 1px solid var(--line-2); border-radius: 10px; font-size: 12.5px; line-height: 1.35; font-weight: 500; }
      .tool .ico { width: 16px; height: 16px; margin-top: 1px; }
      .tool + .tool::before { display: none; }

      /* A VSL sobe para a hero; o bloco de texto dela não se repete no celular */
      #vsl { display: none; }

      /* Blocos curtos e escaneáveis */
      section { padding: 56px 0; }
      .sec-head { margin-bottom: 30px; }
      .sec-head.center, .support-head { text-align: left; }
      .sec-head.center h2, .sec-head.center .lead { margin-left: 0; margin-right: 0; }
      .sec-head h2, .author-info h2 { font-size: clamp(27px, 7.4vw, 38px); line-height: 1.08; }
      .sec-head .lead { font-size: 16px; line-height: 1.5; }
      .market-head { text-align: left; margin: 48px 0 24px; }
      .market-head h3, .faq-sub { text-align: left; font-size: clamp(23px, 6.2vw, 30px); line-height: 1.12; margin-left: 0; }
      .market-head p { margin-left: 0; font-size: 15.5px; }
      .faq-sub { margin: 44px 0 20px; }
      .cta-wrap { margin-top: 28px; }
      .cta-wrap .btn { width: 100%; height: 54px; font-size: 16px; }

      /* Cards de uma linha: ícone à esquerda, texto curto */
      .card-grid, .card-grid--2, .card-grid--5 { grid-template-columns: 1fr; gap: 10px; }
      .card-grid--5 .card, .card-grid--5 .card:nth-child(4), .card-grid--5 .card:nth-child(5) { grid-column: auto; }
      .card, .card--row { display: grid; grid-template-columns: 44px 1fr; gap: 0 14px; align-items: start; padding: 18px 16px; border-radius: 14px; }
      .card .tile, .card--row .tile { width: 44px; height: 44px; border-radius: 12px; margin: 0; grid-row: span 2; }
      .card h3 { font-size: 16.5px; margin: 1px 0 5px; }
      .card p { font-size: 14.5px; line-height: 1.5; grid-column: 2; }
      .stuck { padding: 24px 18px; border-radius: 14px; margin-top: 12px; }
      .stuck .tile { display: none; }
      .stuck h3 { margin: 0 0 16px; font-size: 22px; }
      .stuck .check-list { grid-template-columns: 1fr; gap: 11px; }
      .check-list li { font-size: 15px; }
      .stuck .closing-line { margin-top: 20px; padding-top: 16px; font-size: 15px; }

      /* Recap em lista vertical */
      .recap { margin-top: 28px; text-align: left; }
      .recap h3 { margin-bottom: 14px; font-size: 21px; }
      .recap-list { display: grid; grid-template-columns: 1fr; gap: 10px; justify-content: start; margin: 0; font-size: 15.5px; font-weight: 500; }
      .recap-list li { align-items: flex-start; gap: 12px; }
      .recap-list .ck-ico { display: inline-flex; margin-top: 1px; }
      .recap-list li + li::before { display: none; }
      .recap-list li span:last-child::first-letter { text-transform: uppercase; }

      /* Linha do tempo vertical com a linha verde */
      .tl { grid-template-columns: 1fr; gap: 26px; }
      .tl::before { display: block; left: 25px; right: auto; top: 26px; bottom: 26px; width: 2px; height: auto; background: var(--accent); }
      .tl li { padding: 2px 0 0 70px; min-height: 52px; }

      /* Autoridade: foto → números → bio */
      .author-box { grid-template-columns: 1fr; gap: 24px; }
      .author-avatar { max-width: none; aspect-ratio: 4 / 3.4; border-radius: 16px; }
      .author-avatar img { object-position: center 18%; }
      .author-info { display: flex; flex-direction: column; }
      .author-info .chip { margin-bottom: 12px; align-self: flex-start; }
      .author-info h2 { margin-bottom: 18px; }
      .joe-stats { order: 1; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin: 0 0 20px; justify-content: stretch; }
      .joe-stats div, .joe-stats div:last-child { grid-column: auto; padding: 12px 10px; border: 1px solid var(--line-2); border-radius: 12px; }
      .joe-stats .n { font-size: 38px; height: 38px !important; }
      .joe-stats .n svg { width: 28px; height: 28px; }
      .joe-stats .l { font-size: 10px; letter-spacing: .06em; line-height: 1.3; }
      .author-info > p { order: 2; font-size: 15px; line-height: 1.6; }
      .orgs { margin-top: 36px; }
      .org { padding: 0 22px; }
      .org img { height: 32px; max-width: 150px; opacity: .85; }
      .logo-marquee { -webkit-mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent); mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent); }

      /* Sustentação e FAQ */
      .fit-card { padding: 20px 18px; border-radius: 14px; box-shadow: none; }
      .fit-card .check-list { grid-template-columns: 1fr !important; gap: 12px; }
      .faq-item { border-radius: 14px; }
      .faq-item summary { padding: 16px 14px 16px 16px; font-size: 15.5px; min-height: 60px; }
      .faq-item .ans { padding: 0 16px 18px; font-size: 15px; }

      /* Formulário: alvos grandes, 16px para o iOS não dar zoom */
      .apply-lead { text-align: left; margin: 0 0 22px; font-size: 16px; }
      .form-card { padding: 22px 16px; border-radius: 18px; }
      .radio-grid, .radio-grid--1 { grid-template-columns: 1fr; gap: 8px; }
      .radio { min-height: 50px; padding: 12px 14px; font-size: 15.5px; border-radius: 12px; }
      .radio input { width: 18px; height: 18px; }
      .field input[type="text"], .field input[type="email"], .field input[type="tel"] { font-size: 16px; padding: 15px 14px; }
      .field label, .form-card legend { font-size: 15px; }
      .form-card .btn { height: 56px; font-size: 16.5px; }
      .btn-back { min-height: 44px; font-size: 15px; }
      .form-err { font-size: 14px; }

      /* Rodapé compacto, com folga para o CTA fixo */
      footer { padding: 36px 0 calc(96px + env(safe-area-inset-bottom)); }
      .footer-grid { grid-template-columns: 1fr; gap: 16px; margin-bottom: 22px; }
      .footer-brand img { height: 30px; margin-bottom: 6px; }

      /* CTA fixo após a hero */
      .sticky-cta {
        display: block; position: fixed; z-index: 30; left: 0; right: 0; bottom: 0;
