  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; }
    body { width: 1200px; height: 630px; overflow: hidden; background: #07131a; }
    .og { position: relative; width: 1200px; height: 630px; overflow: hidden; color: #fff; font-family: 'Geist', system-ui, sans-serif; -webkit-font-smoothing: antialiased; isolation: isolate; background: #07131a; }
    .mosaico { position: absolute; top: -170px; right: -110px; width: 860px; height: 1050px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; transform: rotate(-7deg); z-index: -2; }
    .coluna { display: flex; flex-direction: column; gap: 16px; }
    .coluna img { width: 100%; aspect-ratio: 390 / 844; object-fit: cover; object-position: top; border-radius: 14px; background: #0d1d24; box-shadow: 0 0 0 1px #ffffff1a; }
    .shade { position: absolute; inset: 0; z-index: -1; background: linear-gradient(90deg, rgba(4,12,15,.96) 0%, rgba(4,12,15,.88) 44%, rgba(4,12,15,.4) 70%, rgba(4,12,15,.18) 100%), linear-gradient(0deg, rgba(4,12,15,.8), transparent 52%); }
    .marca { position: absolute; top: 54px; left: 64px; display: flex; align-items: center; gap: 16px; }
    .marca .logo { width: 128px; height: auto; }
    .marca .logo path { stroke: none; }
    .marca i { width: 1px; height: 26px; background: #fff; opacity: .3; }
    .marca span { font-size: 16px; font-weight: 500; letter-spacing: -.01em; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #a8dded; flex: none; }
    .copia { position: absolute; left: 64px; bottom: 112px; width: 760px; }
    .eyebrow { font-size: 13px; font-weight: 500; letter-spacing: .09em; text-transform: uppercase; color: #ffffffd9; margin-bottom: 22px; }
    h1 { font-size: 68px; font-weight: 400; line-height: 1.02; letter-spacing: -.056em; }
    h1 span { color: #b5e7f6; }
    .desc { margin-top: 22px; font-size: 19px; line-height: 1.5; color: #ffffffe0; max-width: 640px; }
    .rodape { position: absolute; left: 64px; bottom: 50px; font-size: 13px; color: #ffffffa8; }
    .card { position: absolute; right: 64px; bottom: 50px; width: 236px; padding: 26px 24px 0; border: 1px solid #fff3; border-radius: 14px; background: #ffffff14; backdrop-filter: blur(18px); }
    .card b { display: block; font-size: 80px; font-weight: 300; letter-spacing: -.07em; line-height: 1; }
    .card p { margin-top: 18px; font-size: 20px; line-height: 1.3; letter-spacing: -.02em; }
    .card small { display: flex; align-items: center; gap: 8px; margin-top: 24px; padding-block: 16px; border-top: 1px solid #fff3; font-size: 12px; color: #ffffffbf; }
    .card small .dot { width: 6px; height: 6px; }
  </style>
</head>

    <div class="copia">
      <p class="eyebrow">3ADS · Biblioteca interna de LPs</p>
      <h1>Tudo o que já entregamos,<br><span>num lugar só.</span></h1>
      <p class="desc">Encontre uma referência do nicho e veja no desktop e no celular.</p>
    </div>
    <p class="rodape" id="nichos"></p>
    <div class="card">
      <b id="num">00</b>
      <p>modelos prontos para consulta.</p>
      <small><span class="dot"></span><span id="foot"></span></small>
    </div>
  </div>
  <script>
    // Telas mais coloridas primeiro; o resto do acervo completa as colunas.
    const DESTAQUE = ['opimed-black', 'red-flamboyant', 'barretos', 'paula-cardoso-essence', 'mundo-animal', 'audius',
      'iceo', 'honcord', 'autorio-feirao', 'ryokan', 'fr-incorporadora', 'full-body', 'kingdom-play',
      'hunters-motos', 'scooter-goiania', 'cinthya-lobo', 'savana', 'space-up', 'imperio-piscinas', 'biz-center', 'mundial'];
    const DESLOCA = [-40, -190, -10, -150, -70];
    fetch('../data/modelos.json').then((r) => r.json()).then(async (d) => {
      const paginas = d.modelos.reduce((s, m) => s + m.paginas.length, 0);
      document.getElementById('num').textContent = String(d.modelos.length).padStart(2, '0');
      document.getElementById('foot').textContent = `${paginas} páginas · ${Object.keys(d.nichos).length} nichos`;
      document.getElementById('nichos').textContent = Object.values(d.nichos).map((n) => n.split(' ')[0]).join(' · ');
      const slugs = [...DESTAQUE, ...d.modelos.map((m) => m.slug).filter((s) => !DESTAQUE.includes(s))]
        .filter((s) => d.modelos.some((m) => m.slug === s && m.thumbMobile));
      const cols = Array.from({ length: 5 }, (_, c) => {
        const col = document.createElement('div');
        col.className = 'coluna';
        col.style.transform = `translateY(${DESLOCA[c]}px)`;
        slugs.filter((_, i) => i % 5 === c).slice(0, 4).forEach((s) => {
          const img = new Image();
          img.src = `../thumbs/${s}-m.webp`;
          col.append(img);
        });
        return col;
      });
      document.getElementById('mosaico').append(...cols);
      await Promise.all([...document.images].map((i) => i.decode().catch(() => {})));
      await document.fonts.ready;
      document.body.dataset.pronto = '1';
    });
  </script>
